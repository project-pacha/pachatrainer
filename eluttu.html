<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>പച്ചെഴുത്ത് — Pacha Malayalam Translator</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Malayalam:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', 'Noto Sans Malayalam', system-ui, -apple-system, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
    }
    .ml-text {
      font-family: 'Noto Sans Malayalam', 'Inter', sans-serif;
    }
    /* LanguageTool-style clean highlights */
    .lt-tok {
      border-radius: 4px;
      padding: 1px 3px;
      cursor: pointer;
      transition: background-color 0.12s ease;
    }
    .lt-green {
      background-color: #dcfce7;
      border-bottom: 2px solid #16a34a;
      color: #14532d;
    }
    .lt-green:hover, .lt-green.lt-active {
      background-color: #bbf7d0;
    }
    .lt-red {
      background-color: #fee2e2;
      border-bottom: 2px solid #dc2626;
      color: #7f1d1d;
    }
    .lt-red:hover, .lt-red.lt-active {
      background-color: #fecaca;
    }
    .lt-violet {
      background-color: #ede9fe;
      border-bottom: 2px solid #7c3aed;
      color: #4c1d95;
    }
    .lt-violet:hover, .lt-violet.lt-active {
      background-color: #ddd6fe;
    }
    .lt-native {
      padding: 1px 1px;
    }
    /* Floating LanguageTool-style popover */
    #lt-popover {
      box-shadow: 0 12px 32px -4px rgba(15, 23, 42, 0.16), 0 4px 12px -2px rgba(15, 23, 42, 0.08);
    }
    @media (max-width: 639px) {
      #lt-popover {
        position: fixed !important;
        left: 12px !important;
        right: 12px !important;
        bottom: 12px !important;
        top: auto !important;
        width: auto !important;
        max-width: none !important;
      }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Minimal Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
    <div class="max-w-5xl mx-auto px-4 h-14 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <!-- Logo Image Slot: replace src="./logo.png" with your logo file or URL -->
        <div id="logo-slot" class="w-8 h-8 rounded-lg bg-emerald-600 flex items-center justify-center overflow-hidden shrink-0">
          <img id="app-logo" alt="പച്ചെഴുത്ത്" class="w-full h-full object-contain hidden" />
          <span id="logo-fallback" class="text-white font-bold text-base ml-text leading-none">പ</span>
        </div>
        <h1 class="text-lg font-bold tracking-tight text-slate-900 ml-text">പച്ചെഴുത്ത്</h1>
        <span id="csv-status-dot" class="w-2 h-2 rounded-full bg-amber-400 inline-block" title="Loading dictionaries..."></span>
      </div>
      <div class="flex items-center gap-1.5 text-[11px] text-slate-500">
        <span class="hidden sm:inline-flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-emerald-500"></span>പച്ച</span>
        <span class="hidden sm:inline-flex items-center gap-1 ml-2"><span class="w-2 h-2 rounded-full bg-red-500"></span>കടം/അനുചിതം</span>
        <span class="hidden sm:inline-flex items-center gap-1 ml-2"><span class="w-2 h-2 rounded-full bg-violet-600"></span>പേര്</span>
      </div>

  </header>

  <!-- Minimal LanguageTool-Style Editor -->
  <main class="flex-1 max-w-5xl w-full mx-auto px-3 sm:px-4 py-4 sm:py-6 flex flex-col gap-4">
    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden grid grid-cols-1 lg:grid-cols-2 divide-y lg:divide-y-0 lg:divide-x divide-slate-200 flex-1 min-h-[360px] sm:min-h-[420px]">

      <!-- Left: Input Pane -->
      <div class="flex flex-col order-1">
        <div class="px-4 py-2.5 border-b border-slate-100 flex items-center justify-between gap-2">
          <label class="inline-flex items-center gap-1.5 text-xs font-medium text-slate-600 cursor-pointer select-none">
            <input id="toggle-manglish" type="checkbox" class="w-3.5 h-3.5 accent-emerald-600 rounded" />
            <span>Manglish</span>
          </label>
          <button id="btn-clear" type="button" title="Clear" class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-xs font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
            <span>Clear</span>

        </div>
        <textarea
          id="source-input"
          class="flex-1 w-full p-4 sm:p-5 text-[19px] sm:text-[18px] leading-relaxed ml-text text-slate-800 placeholder-slate-400 bg-transparent focus:outline-none resize-none min-h-[180px] lg:min-h-[340px]"
          placeholder="ഇവിടെ എഴുതുക അല്ലെങ്കിൽ ഒട്ടിക്കുക... (വിവർത്തനം ഒഴിവാക്കാൻ *പദം* എന്ന് നൽകുക)"
        ></textarea>
      </div>

      <!-- Right: Output Pane -->
      <div class="flex flex-col bg-slate-50/40 order-3 lg:order-2">
        <div class="px-4 py-2.5 border-b border-slate-100 flex items-center justify-end">
          <button id="btn-copy" type="button" title="Copy" class="inline-flex items-center gap-1.5 px-3 py-1 rounded-lg text-xs font-medium bg-emerald-600 hover:bg-emerald-700 text-white transition">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
            <span>Copy</span>
          </button>
        </div>
        <div
          id="output-display"
          class="flex-1 w-full p-4 sm:p-5 text-[19px] sm:text-[18px] leading-loose ml-text text-slate-900 overflow-y-auto min-h-[180px] lg:min-h-[340px]"
        ></div>
      </div>

      <!-- Conditional Splitting Panel for Alternative Suggestions (bottom of Input on mobile, bottom bar on desktop) -->
      <div id="alt-split-panel" class="hidden order-2 lg:order-3 lg:col-span-2 border-t border-slate-200 bg-white px-4 py-3 space-y-2 max-h-48 overflow-y-auto">
        <div class="text-[10px] font-bold uppercase tracking-wider text-slate-400">Alternative Suggestions</div>
        <div id="alt-split-list" class="space-y-1.5"></div>
      </div>

    </div>
  </main>

  <!-- Floating LanguageTool Popover (Hover on Desktop / Tap on Mobile / Click for Analysis & Corrections) -->
  <div id="lt-popover" class="hidden fixed z-50 w-80 max-w-[calc(100vw-24px)] bg-white rounded-xl border border-slate-200 p-3.5 text-sm">
    <div id="lt-popover-content"></div>
  </div>

  <!-- Toast -->
  <div id="toast" class="hidden fixed bottom-5 right-5 z-50 bg-slate-900 text-white px-4 py-2 rounded-xl text-xs font-medium shadow-lg"></div>

  <script>
    // ==================== CONFIGURE GITHUB CORRECTIONS HERE ====================
    // Set your GitHub "username/repo" to send corrections directly as pre-filled GitHub Issues/Comments.
    // Leave as '' to copy formatted Markdown corrections to clipboard instead.
    const CONFIG = {
      correctionEndpoint: '', // For NO-LOGIN submissions: paste a free Formspree (https://formspree.io/f/xxxx) or Web3Forms URL
      githubRepo: '', // Or 'username/repo' (or full GitHub URL) to open a pre-filled GitHub Issue (requires GitHub login)
      githubLabels: 'correction',
      logoUrl: '' // e.g. './logo.png' or 'https://.../logo.png' when hosted on GitHub Pages
    };

    // ==================== 1. ISO 15919 + ŭ TRANSLITERATION LAYER ====================
    const ML_INDEP_VOWELS = {
      'അ': 'a', 'ആ': 'ā', 'ഇ': 'i', 'ഈ': 'ī', 'ഉ': 'u', 'ഊ': 'ū',
      'ഋ': 'r̥', 'എ': 'e', 'ഏ': 'ē', 'ഐ': 'ai', 'ഒ': 'o', 'ഓ': 'ō', 'ഔ': 'au'
    };
    const ML_DEP_VOWELS = {
      'ാ': 'ā', 'ി': 'i', 'ീ': 'ī', 'ു': 'u', 'ൂ': 'ū', 'ൃ': 'r̥',
      'െ': 'e', 'േ': 'ē', 'ൈ': 'ai', 'ൊ': 'o', 'ോ': 'ō', 'ൗ': 'au', 'ൌ': 'au'
    };
    const ML_CONSONANTS = {
      'ക': 'k', 'ഖ': 'kh', 'ഗ': 'g', 'ഘ': 'gh', 'ങ': 'ṅ',
      'ച': 'c', 'ഛ': 'ch', 'ജ': 'j', 'ഝ': 'jh', 'ഞ': 'ñ',
      'ട': 'ṭ', 'ഠ': 'ṭh', 'ഡ': 'ḍ', 'ഢ': 'ḍh', 'ണ': 'ṇ',
      'ത': 't', 'ഥ': 'th', 'ദ': 'd', 'ധ': 'dh', 'ന': 'n',
      'പ': 'p', 'ഫ': 'ph', 'ബ': 'b', 'ഭ': 'bh', 'മ': 'm',
      'യ': 'y', 'ര': 'r', 'ല': 'l', 'വ': 'v', 'ശ': 'ś', 'ഷ': 'ṣ', 'സ': 's', 'ഹ': 'h',
      'ള': 'ḷ', 'ഴ': 'ḻ', 'റ': 'ṟ', 'ഩ': 'ṉ'
    };
    const ML_CHILLUS = {
      'ൺ': 'ṇ', 'ൻ': 'n', 'ർ': 'r', 'ൽ': 'l', 'ൾ': 'ḷ', 'ൿ': 'k'
    };
    const ML_SIGNS = { 'ം': 'ṁ', 'ഃ': 'ḥ' };

    function normalizeMalayalam(str) {
      return String(str || '')
        .replace(/\u0D23\u0D4D\u200D/g, 'ൺ')
        .replace(/\u0D28\u0D4D\u200D/g, 'ൻ')
        .replace(/\u0D30\u0D4D\u200D/g, 'ർ')
        .replace(/\u0D32\u0D4D\u200D/g, 'ൽ')
        .replace(/\u0D33\u0D4D\u200D/g, 'ൾ')
        .replace(/\u0D15\u0D4D\u200D/g, 'ൿ')
        .replace(/\u200D/g, '');
    }

    function mlToIso(input) {
      const s = normalizeMalayalam(input);
      let out = '';
      let i = 0;
      const isConsOrChillu = ch => Boolean(ML_CONSONANTS[ch] || ML_CHILLUS[ch]);

      while (i < s.length) {
        const ch = s[i];
        // Handle ന്റ (ൻ + ് + റ or ന + ് + റ) -> nṯ
        if ((ch === 'ൻ' || ch === 'ന') && s[i + 1] === '്' && s[i + 2] === 'റ') {
          out += 'nṯ';
          i += 3;
          const next = s[i];
          if (ML_DEP_VOWELS[next]) {
            out += ML_DEP_VOWELS[next];
            i++;
          } else if (next === '്') {
            out += 'ŭ';
            i++;
          } else {
            out += 'a';
          }
          continue;
        }
        // Handle റ്റ (റ + ് + റ) -> ṯṯ
        if (ch === 'റ' && s[i + 1] === '്' && s[i + 2] === 'റ') {
          out += 'ṯṯ';
          i += 3;
          const next = s[i];
          if (ML_DEP_VOWELS[next]) {
            out += ML_DEP_VOWELS[next];
            i++;
          } else if (next === '്') {
            out += 'ŭ';
            i++;
          } else {
            out += 'a';
          }
          continue;
        }
        if (ML_INDEP_VOWELS[ch]) {
          out += ML_INDEP_VOWELS[ch];
          i++;
          continue;
        }
        if (ML_CHILLUS[ch]) {
          out += ML_CHILLUS[ch];
          i++;
          continue;
        }
        if (ML_SIGNS[ch]) {
          out += ML_SIGNS[ch];
          i++;
          continue;
        }
        if (ML_CONSONANTS[ch]) {
          out += ML_CONSONANTS[ch];
          i++;
          const next = s[i];
          if (next === '്') {
            i++;
            // Check if followed by consonant (conjunct) or word boundary (samvrutokaram ŭ)
            const afterVirama = s[i];
            if (afterVirama && isConsOrChillu(afterVirama)) {
              // Conjunct consonant cluster: no vowel, no ŭ
            } else {
              out += 'ŭ';
            }
          } else if (ML_DEP_VOWELS[next]) {
            // Check for samvrutokaram written as ു്
            if (next === 'ു' && s[i + 1] === '്' && (!s[i + 2] || !isConsOrChillu(s[i + 2]))) {
              out += 'ŭ';
              i += 2;
            } else {
              out += ML_DEP_VOWELS[next];
              i++;
            }
          } else {
            out += 'a';
          }
          continue;
        }
        out += ch;
        i++;
      }
      return out;
    }

    const ISO_VOWELS_LIST = ['ai', 'au', 'r̥', 'ā', 'ī', 'ū', 'ē', 'ō', 'a', 'i', 'u', 'e', 'o'];
    const ISO_INDEP_VOWEL_MAP = {
      'a': 'അ', 'ā': 'ആ', 'i': 'ഇ', 'ī': 'ഈ', 'u': 'ഉ', 'ū': 'ഊ',
      'r̥': 'ഋ', 'e': 'എ', 'ē': 'ഏ', 'ai': 'ഐ', 'o': 'ഒ', 'ō': 'ഓ', 'au': 'ഔ'
    };
    const ISO_DEP_VOWEL_MAP = {
      'a': '', 'ā': 'ാ', 'i': 'ി', 'ī': 'ീ', 'u': 'ു', 'ū': 'ൂ',
      'r̥': 'ൃ', 'e': 'െ', 'ē': 'േ', 'ai': 'ൈ', 'o': 'ൊ', 'ō': 'ോ', 'au': 'ൗ'
    };
    const ISO_CONSONANTS_LIST = [
      'nṯ', 'ṯṯ', 'kh', 'gh', 'ch', 'jh', 'ṭh', 'ḍh', 'th', 'dh', 'ph', 'bh',
      'k', 'g', 'ṅ', 'c', 'j', 'ñ', 'ṭ', 'ḍ', 'ṇ', 't', 'd', 'n', 'p', 'b', 'm',
      'y', 'r', 'l', 'v', 'ś', 'ṣ', 's', 'h', 'ḷ', 'ḻ', 'ṟ', 'ṯ', 'ṉ'
    ];
    const ISO_CONS_MAP = {
      'nṯ': '\u0D7B\u0D4D\u0D31', // ALWAYS chillu ൻ + ് + റ = ന്റ
      'ṯṯ': 'റ്റ',
      'kh': 'ഖ', 'gh': 'ഘ', 'ch': 'ഛ', 'jh': 'ഝ', 'ṭh': 'ഠ', 'ḍh': 'ഢ',
      'th': 'ഥ', 'dh': 'ധ', 'ph': 'ഫ', 'bh': 'ഭ',
      'k': 'ക', 'g': 'ഗ', 'ṅ': 'ങ', 'c': 'ച', 'j': 'ജ', 'ñ': 'ഞ',
      'ṭ': 'ട', 'ḍ': 'ഡ', 'ṇ': 'ണ', 't': 'ത', 'd': 'ദ', 'n': 'ന',
      'p': 'പ', 'b': 'ബ', 'm': 'മ', 'y': 'യ', 'r': 'ര', 'l': 'ല',
      'v': 'വ', 'ś': 'ശ', 'ṣ': 'ഷ', 's': 'സ', 'h': 'ഹ',
      'ḷ': 'ള', 'ḻ': 'ഴ', 'ṟ': 'റ', 'ṯ': 'റ', 'ṉ': 'ഩ'
    };
    const ISO_CHILLU_END_MAP = {
      'n': 'ൻ', 'ṇ': 'ൺ', 'r': 'ർ', 'l': 'ൽ', 'ḷ': 'ൾ', 'k': 'ൿ'
    };

    function isoToMlWord(word) {
      let out = '';
      let i = 0;
      const matchFrom = (list, pos) => list.find(tok => word.startsWith(tok, pos)) || null;

      while (i < word.length) {
        if (word[i] === 'ṁ' || word[i] === 'ṃ') {
          out += 'ം';
          i++;
          continue;
        }
        if (word[i] === 'ḥ') {
          out += 'ഃ';
          i++;
          continue;
        }
        const cons = matchFrom(ISO_CONSONANTS_LIST, i);
        if (cons) {
          i += cons.length;
          if (word[i] === 'ŭ') {
            out += ISO_CONS_MAP[cons] + '്';
            i++;
            continue;
          }
          const vow = matchFrom(ISO_VOWELS_LIST, i);
          if (vow) {
            out += ISO_CONS_MAP[cons] + ISO_DEP_VOWEL_MAP[vow];
            i += vow.length;
            continue;
          }
          // No vowel and no ŭ following
          if (i >= word.length) {
            // Word-final bare consonant -> chillu if available, else virama
            out += ISO_CHILLU_END_MAP[cons] || (ISO_CONS_MAP[cons] + '്');
          } else if (ISO_CHILLU_END_MAP[cons]) {
            const nextCons = matchFrom(ISO_CONSONANTS_LIST, i);
            // Only ങ്ക (ṅk), ഞ്ച (ñc), ണ്ട (ṇṭ), ന്ത (nt), മ്പ (mp), ന്റ (nṯ) and geminates (ṇṇ, nn, ll, ḷḷ) form virama conjuncts
            const isAllowedConjunct =
              (nextCons && nextCons === cons) ||
              (cons === 'ṇ' && nextCons === 'ṭ') ||
              (cons === 'n' && ['t', 'ṯ', 'd', 'm', 'r', 'ś', 's', 'y', 'v'].includes(nextCons)) ||
              (cons === 'ḷ' && nextCons === 'y') ||
              (cons === 'l' && nextCons === 'y');
            out += isAllowedConjunct ? (ISO_CONS_MAP[cons] + '്') : ISO_CHILLU_END_MAP[cons];
          } else {
            out += ISO_CONS_MAP[cons] + '്';
          }
          continue;
        }
        const vow = matchFrom(ISO_VOWELS_LIST, i);
        if (vow) {
          out += ISO_INDEP_VOWEL_MAP[vow];
          i += vow.length;
          continue;
        }
        out += word[i];
        i++;
      }
      return out;
    }

    function isoToMl(isoText) {
      return String(isoText || '').split(/(\s+|[.,!?;:"'()—–\-]+)/).map(tok => {
        if (!tok || /^\s+$/.test(tok) || /^[.,!?;:"'()—–\-]+$/.test(tok)) return tok;
        return isoToMlWord(tok);
      }).join('');
    }

    // ==================== 2. SANDHI & AGGLUTINATION ENGINE (ISO 15919) ====================
    // Case categories: 'loc' (il), 'gen' (inṯe/uṭe), 'dat' (ŭ/kku), 'pl' (mār/kaḷ), 'neg' (illa), 'conj' (um), 'cop' (āṇŭ)
    const SEED_SUFFIX_RULES = [
      { id: 'r1', src_suffix: 'ttil', case_type: 'loc', notes: '-am / -ttŭ locative' },
      { id: 'r1_ttekku', src_suffix: 'ttēkkŭ', case_type: 'towards', notes: '-am towards (-ttēkkŭ)' },
      { id: 'r1_ekku', src_suffix: 'ēkkŭ', case_type: 'towards', notes: 'towards (-ēkkŭ)' },
      { id: 'r_v_kkanam', src_suffix: 'kkaṇaṁ', case_type: 'verb_aṇaṁ', notes: 'Verb optative/must (-kkaṇaṁ)' },
      { id: 'r_v_anam', src_suffix: 'aṇaṁ', case_type: 'verb_aṇaṁ', notes: 'Verb optative/must (-aṇaṁ)' },
      { id: 'r_v_kkanta', src_suffix: 'kkaṇṭa', case_type: 'verb_aṇṭa', notes: 'Verb negative optative (-kkaṇṭa)' },
      { id: 'r_v_anta', src_suffix: 'aṇṭa', case_type: 'verb_aṇṭa', notes: 'Verb negative optative (-aṇṭa)' },
      { id: 'r_voc_o', src_suffix: 'ō', case_type: 'voc_ō', notes: 'Additional vocative/interrogative (-ō)' },
      { id: 'r_cmp_olam', src_suffix: 'ōḷaṁ', case_type: 'ōḷaṁ', notes: 'Comparative (-ōḷaṁ)' },
      { id: 'r_cmp_olamo', src_suffix: 'ōḷamō', case_type: 'ōḷamō', notes: 'Comparative question (-ōḷamō)' },
      { id: 'r_cmp_olamilla', src_suffix: 'ōḷamilla', case_type: 'ōḷamilla', notes: 'Comparative neg (-ōḷamilla)' },
      { id: 'r_cmp_olamalla', src_suffix: 'ōḷamalla', case_type: 'ōḷamalla', notes: 'Comparative neg (-ōḷamalla)' },
      { id: 'r_quot_atre', src_suffix: 'atrē', case_type: 'atrē', notes: 'Quotative (-atrē)' },
      { id: 'r_quot_itre', src_suffix: 'itrē', case_type: 'itrē', notes: 'Quotative (-itrē)' },
      { id: 'r_quot_atreyullu', src_suffix: 'atrēyuḷḷu', case_type: 'atrēyuḷḷu', notes: 'Quotative (-atrēyuḷḷu)' },
      { id: 'r_quot_atreyullo', src_suffix: 'atrēyuḷḷō', case_type: 'atrēyuḷḷō', notes: 'Quotative (-atrēyuḷḷō)' },
      { id: 'r_quot_atreyulla', src_suffix: 'atrēyuḷḷa', case_type: 'atrēyuḷḷa', notes: 'Quotative (-atrēyuḷḷa)' },
      { id: 'r_quot_atreyillatta', src_suffix: 'atrēyillātta', case_type: 'atrēyillātta', notes: 'Quotative (-atrēyillātta)' },
      { id: 'r_quot_itreyullu', src_suffix: 'itrēyuḷḷu', case_type: 'itrēyuḷḷu', notes: 'Quotative (-itrēyuḷḷu)' },
      { id: 'r_quot_itreyullo', src_suffix: 'itrēyuḷḷō', case_type: 'itrēyuḷḷō', notes: 'Quotative (-itrēyuḷḷō)' },
      { id: 'r_quot_itreyulla', src_suffix: 'itrēyuḷḷa', case_type: 'itrēyuḷḷa', notes: 'Quotative (-itrēyuḷḷa)' },
      { id: 'r_quot_itreyillatta', src_suffix: 'itrēyillātta', case_type: 'itrēyillātta', notes: 'Quotative (-itrēyillātta)' },
      { id: 'r_conc_alum', src_suffix: 'āluṁ', case_type: 'āluṁ', notes: 'Concessive (-āluṁ)' },

    function isShortVowelBefore(stemIso, tailLen = 1) {
      const idx = stemIso.length - tailLen - 1;

      return ['a', 'i', 'u', 'e', 'o'].includes(stemIso[idx]);
    }

    function isLongVowelBefore(stemIso, tailLen = 1) {
      const idx = stemIso.length - tailLen - 1;

      return ['ā', 'ī', 'ū', 'ē', 'ō'].includes(stemIso[idx]);

    function applyCaseSandhiIso(stemIso, caseType, entryMeta = {}) {

      // Case markers (loc, gen, dat, acc, soc, pl) only affect nouns and pronouns

        return stemIso;
      }
      const isGendered = Boolean(entryMeta.isGendered);
      const rSandhi = entryMeta.rSandhi || 'ril';
      const endsAm = stemIso.endsWith('am') || stemIso.endsWith('aṁ');
      const endsLongAm = /[āīū][mṁ]$/.test(stemIso);

      // 1. Plural (mār for gendered, kaḷ for non-gendered)

          if (stemIso.endsWith('ŭ')) return stemIso.slice(0, -1) + 'umār';
          return stemIso + 'mār';
        }
        if (endsAm) return stemIso.slice(0, -2) + 'aṅṅaḷ'; // maram -> maraṅṅaḷ
        if (stemIso.endsWith('āvŭ')) return stemIso.slice(0, -2) + 'kkaḷ'; // akamitāvŭ -> akamitākkaḷ
        if (stemIso.endsWith('vu')) return stemIso + 'kaḷ'; // anuvu -> anuvukaḷ
        if (stemIso.endsWith('ā') || stemIso.endsWith('u') || stemIso.endsWith('ū')) return stemIso + 'kkaḷ'; // nilākkaḷ, aṇukkaḷ, tanukkaḷ

        if (stemIso.endsWith('r')) {

        }

        if (stemIso.endsWith('l')) return stemIso + 'ine'; // kāl -> kāline
        if (stemIso.endsWith('ḷ')) return stemIso + 'e'; // avaḷ -> avaḷe
        if (stemIso.endsWith('n')) {
          return isLongVowelBefore(stemIso) ? stemIso + 'ine' : stemIso + 'e'; // mān -> mānine, avan -> avane

      if (caseType === 'soc') {
        if (endsAm) return stemIso.slice(0, -2) + 'attōṭŭ'; // maram -> marattōṭŭ

      if (caseType === 'neg_vēṇṭa') return stemIso + 'vēṇṭa';
      if (caseType === 'nom_tŭ') return stemIso + 'tŭ';
      if (caseType === 'cond_eṅkil') return joinVowelSuffix(stemIso, 'eṅkil');
      if (caseType === 'ennuṁ') return joinVowelSuffix(stemIso, 'ennuṁ');
      if (caseType === 'uḷḷu') return joinVowelSuffix(stemIso, 'uḷḷu');
      if (caseType === 'allāte') return joinVowelSuffix(stemIso, 'allāte');
      if (caseType === 'voc_ō') return joinVowelSuffix(stemIso, 'ō');

    const csvDicts = {
      loaded: false,

    async function gunzipBase64Json(b64) {
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      const ds = new DecompressionStream('gzip');
      const stream = new Blob([bytes]).stream().pipeThrough(ds);
      const text = await new Response(stream).text();
      return JSON.parse(text);
    }

    async function initCsvBundles() {
      const badge = document.getElementById('csv-status-dot');
      try {
        if (typeof DecompressionStream !== 'function') throw new Error('DecompressionStream unavailable');
        const [rwRaw, skRaw] = await Promise.all([
          gunzipBase64Json(ROOTWORDS_CSV_GZ_B64),
          gunzipBase64Json(SKT_NON_DET_GZ_B64)
        ]);
        let rwCount = 0;
        Object.keys(rwRaw).forEach(col => {
          const s = new Set();
          rwRaw[col].forEach(w => { s.add(w); if (w.endsWith('-')) s.add(w.replace(/-+$/, '')); });
          csvDicts.rootwords[col] = s;
          rwCount += rwRaw[col].length;
        });
        let skCount = 0;
        Object.keys(skRaw).forEach(col => {
          const s = new Set();
          skRaw[col].forEach(w => { s.add(w); if (w.endsWith('-')) s.add(w.replace(/-+$/, '')); });
          csvDicts.sktNonDet[col] = s;
          skCount += skRaw[col].length;
        });
        csvDicts.rwTotal = rwCount;
        csvDicts.skTotal = skCount;
        csvDicts.loaded = true;
        if (badge) {
          badge.title = `Ready · ${rwCount.toLocaleString()} rootwords · ${skCount.toLocaleString()} non-detectable`; badge.classList.remove('bg-amber-400'); badge.classList.add('bg-emerald-500');
        }
      } catch (err) {
        if (badge) badge.title = 'Dictionaries unavailable';
      }
    }

    // Step 2 helper: isolate candidate stems in ISO 15919 per rulesofpacha.txt Section 2
    function isolateIsoStems(isoWord) {
      const w = String(isoWord || '').toLowerCase().trim().replace(/-+$/, '');
      if (!w) return [];
      const stems = new Set([w]);
      const addStem = s => {
        if (s && s.length >= 2) {
          stems.add(s);
          if (s.endsWith('ŭ')) stems.add(s.slice(0, -1));
          if (s.endsWith('m')) stems.add(s.slice(0, -1) + 'ṁ');
          if (s.endsWith('ṁ')) { stems.add(s.slice(0, -1) + 'm'); stems.add(s.slice(0, -1)); }
        }
      };

      addStem(w);
      // 2.1.1 -āmalla -> -āṁ + alla; -āmilla -> -āṁ + illa
      if (w.endsWith('āmalla') || w.endsWith('āmilla')) {
        addStem(w.slice(0, -4) + 'ṁ');
        addStem(w.slice(0, -5) + 'āṁ');
      }

      // Common suffix stripping (2.2 cases, 2.3 particles/copula/neg/aff, 2.4 verb tense/past, 2.5 adj, 2.7 questions)
      const PACHA_SUFFIXES = [
        'ukayāyirunnilla', 'ilēkkuḷḷa', 'uvēṇṭunna', 'uvēṇṭātta', 'ukayāṇŭ', 'ukayāṇu',
        'ttinaṭiyil', 'ttinmēl', 'ttinmē', 'ttināyi', 'ttināy', 'ttiṅkal', 'ttinṟe', 'ttinŭ', 'ttōṭŭ',
        'ykkaṭiyil', 'yinmēl', 'ykkāyi', 'ykkāy', 'yiṅkal', 'yyinmēl', 'yyuṭe', 'yyōṭŭ', 'yyāṇŭ', 'yyāṇu',
        'vinaṭiyil', 'vinmēl', 'vināyi', 'vināy', 'viṅkal', 'vinṟe', 'vinŭ', 'vōṭŭ', 'vāṇŭ', 'vāṇu',
        'inaṭiyil', 'inmēl', 'ināyi', 'ināy', 'iṅkal', 'inṟe', 'inŭ', 'ilninnŭ', 'ilninnu', 'ilēkkŭ',
        'ṅṅaḷuṁ', 'ṅṅaḷ', 'umottŭ', 'umāyi', 'uvēṇṭi', 'uvēṇō', 'uvēṇṭē', 'uvēṇaṁ',
        'ccukoṇṭirikkunna', 'ccukoṇṭirikkunnu', 'cciṭṭillātta', 'cciṭṭilla', 'cciṭṭŭ', 'ppikkuka', 'ppiccu', 'ppicca', 'ppān', 'kkumpōḷ', 'ykkumpōḷ', 'umpōḷ', 'kkātta', 'ykkātta', 'ātta', 'kkukayilla', 'ykkukayilla', 'ukayilla', 'ukilla', 'kkān', 'ykkān', 'uvān', 'ān', 'kkātirikkunna', 'kkātirikkunnu', 'kkāteyuḷḷa', 'kkānākātta', 'kkānākātte', 'ykkāte', 'kkāte', 'āte', 'kkān', 'ykkān', 'kkaṇaṁ', 'kkaṇṭa', 'aṇaṁ', 'aṇṭa', 'ykkunnilla', 'kkunnilla', 'unnilla', 'ykkunnu', 'kkunnu', 'unnu', 'ykkunna', 'kkunna', 'unna', 'ykkuka', 'kkuka', 'uka', 'kkāṁ', 'kkuṁ', 'ccāl', 'ccu', 'cca', 'nna', 'nnilla', 'koṇṭuḷḷa', 'illātta', 'ākāvunna', 'ākkāvunna', 'pōluḷḷa', 'pōlatte',
        'ākunna', 'niṟañña', 'alleyō', 'uṇṭō', 'āṇō', 'allē', 'illē',
        'ttil', 'ttāl', 'tte', 'ttŭ', 'ykkŭ', 'yuṭe', 'yāl', 'yōṭŭ', 'yil', 'yē', 'ye', 'yāṇŭ', 'yāṇu',
        'vine', 'vāl', 'vē', 'vukaḷ', 'kkaḷ', 'ukaḷ', 'ṅkaḷ', 'mār', 'umār', 'amār', 'imār', 'īmār', 'āmār', 'ūmār', 'kaḷ',
        'māṇŭ', 'māṇu', 'ṇāṇŭ', 'ṇāṇu', 'lāṇŭ', 'lāṇu', 'ḷāṇŭ', 'ḷāṇu', 'āṇŭ', 'āṇu',
        'arutŭ', 'alla', 'illa', 'pōra', 'vēṇṭa', 'uṇṭŭ', 'uṇṭu', 'vēṇaṁ',
        'ārnna', 'peṭṭa', 'keṭṭa', 'takka', 'enna', 'aṟṟa', 'uṟṟa', 'uḷḷa', 'āya', 'āyi',
        'mēl', 'aṭiyil', 'ināl', 'āl', 'ōṭŭ', 'il', 'uṁ', 'ē', 'e', 'ŭ', 'ō'
      ];

      // Include user-defined suffix rules from SQLite alongside built-in Pacha suffixes
      const userSufs = (typeof state !== 'undefined' && Array.isArray(state.suffixRules))
        ? state.suffixRules.map(r => r.src_suffix).filter(Boolean)
        : [];
      const ALL_SUFFIXES = Array.from(new Set([...userSufs, ...PACHA_SUFFIXES])).sort((a, b) => b.length - a.length);

      // 3-pass stripping for agglutinative chains (plural + case + particle / verb chains)
      let frontier = [w];
      for (let pass = 0; pass < 3; pass++) {
        const nextFrontier = [];
        for (const cur of frontier) {
          for (const suf of ALL_SUFFIXES) {
            if (cur.length > suf.length + 1 && cur.endsWith(suf)) {
              const stem = cur.slice(0, cur.length - suf.length);
              addStem(stem);
              nextFrontier.push(stem);
              if (suf.startsWith('tt') && !stem.endsWith('a')) { addStem(stem + 'aṁ'); addStem(stem + 'am'); }
              if (suf === 'ṅṅaḷ' || suf === 'ṅṅaḷuṁ') { addStem(stem + 'ṁ'); addStem(stem + 'm'); }
              if (stem.endsWith('ṇṇ') || stem.endsWith('ll') || stem.endsWith('ḷḷ')) {
                addStem(stem.slice(0, -1));
              }
              if (stem.endsWith('ayy')) addStem(stem.slice(0, -3) + 'ai');
              if (stem.endsWith('y') || stem.endsWith('v')) addStem(stem.slice(0, -1));
              if (stem.endsWith('m')) addStem(stem.slice(0, -1) + 'ṁ');
              if (!/[aāiīuūeēoōŭṁ]$/.test(stem)) addStem(stem + 'ŭ');
            }
          }
        }
        frontier = nextFrontier.slice(0, 24);
      }

      // 2.4.3 Simple past verb stem recovery
      const PAST_MAP = [
        ['annu', 'akku'], ['unnu', 'ikku'], ['ennu', 'ellu'],
        ['ninnu', 'nilkku'], ['iṯṯu', 'ilkku'], ['ōṯṯu', 'ōlkku'], ['aṯṯu', 'alkku'],
        ['ēṭṭu', 'ēḷkku'], ['oṭṭu', 'oṭu'], ['eṭṭu', 'eṭu'],
        ['uttu', 'ukku'], ['accu', 'aykku'], ['iccu', 'ikku'],
        ['arnnu', 'aru'], ['nontu', 'nōvu'], ['ventu', 'vēvu'],
        ['uṇṭu', 'uḷu'], ['āññu', 'āyu'], ['aññu', 'ayu'],
        ['cattu', 'cāku'], ['koṇṭu', 'koḷḷu'], ['kaṭṭu', 'kakku'], ['kanattu', 'kanakku']
      ];
      PAST_MAP.forEach(([p, r]) => {
        if (w.endsWith(p) && w.length > p.length + 1) addStem(w.slice(0, -p.length) + r);
      });
      if (w.endsWith('i') && w.length > 3) addStem(w.slice(0, -1) + 'u');

      return Array.from(stems);
    }

    function lookupCsvDict(dictObj, cols, stems) {
      if (!csvDicts.loaded) return null;
      for (const col of cols) {
        const set = dictObj[col];
        if (!set) continue;
        for (const s of stems) {
          if (set.has(s)) return { col, match: s };
          if (s.endsWith('ŭ') && set.has(s.slice(0, -1))) return { col, match: s.slice(0, -1) };
        }
      }
      return null;
    }

    // O(L) root-prefix check for agglutinative verbs (e.g. anucinti- + kkāteyuḷḷa)
    function lookupVerbRootPrefix(dictObj, col, wIso) {
      if (!csvDicts.loaded || !dictObj[col] || !wIso || wIso.length < 5) return null;
      const set = dictObj[col];
      for (let len = wIso.length - 1; len >= 4; len--) {
        const pref = wIso.slice(0, len);
        if (set.has(pref)) {
          const rest = wIso.slice(len);
          if (/^(kk|ykk|cc|tt|nn|uk|un|ān|āt|ār|i|u|a|ā|e|ē|ō)/.test(rest)) {
            return { col, match: pref, rest };
          }
        }
      }
      return null;
    }

    // Step 3: rulesofpacha.txt Rules 1.1 – 1.10 in ISO 15919
    function checkPachaLoanRulesIso(wordIso, stems) {
      const w = String(wordIso || '').toLowerCase();
      const reasons = [];
      const categories = new Set();
      if (!w || w === 'paramāṇu') {
        if (w === 'paramāṇu') {
          reasons.push('2.3.7: paramāṇu (Sanskrit loan)');
          categories.add('Sanskrit Loan');
        }
        return { reasons, categories: Array.from(categories) };
      }

      const allForms = stems && stems.length ? stems : [w];
      const hasException = (list) => allForms.some(f => list.some(ex => f === ex || f.startsWith(ex)));

      // 1.1 Mahapranas
      if (/(kh|gh|ch|jh|ṭh|ḍh|th|dh|ph|bh)/.test(w)) {
        if (!hasException(['viḍḍhi', 'śēkhara', 'śēkhari'])) {
          reasons.push('Rule 1.1: Mahaprana');
          categories.add('Sanskrit Loan');
        }
      }

      // 1.2 Voiced stops, retroflex ṣ & s
      if (/[gjḍdbṣ]/.test(w)) {
        if (!hasException(['daśa', 'daśanār', 'gaḍi', 'gaḍḍi', 'guṇṭ', 'viḷambu', 'viḍḍhi'])) {
          reasons.push('Rule 1.2: Voiced/ṣ (g/j/ḍ/d/b/ṣ)');
          categories.add('Sanskrit / Foreign Loan');
        }
      }
      if (/s/.test(w)) {
        if (!hasException(['srāv', 'taṭassa', 'urasuka', 'urasal'])) {
          reasons.push('Rule 1.2: Contains s (loan)');
          categories.add('Sanskrit / Foreign Loan');
        }
      }

      // 1.3 r̥ and ḥ (no exceptions)
      if (/r̥|ḥ/.test(w)) {
        reasons.push('Rule 1.3: r̥ / visarga ḥ');
        categories.add('Sanskrit Loan');
      }

      // 1.4 English clusters & CV clusters
      const engClusters = ['ḻs', 'sṯṯ', 'sk', 'bl', 'br', 'ḍr', 'phl', 'phr', 'gl', 'skr', 'sṭr', 'ṭv', 'kc', 'kṭ',
        'isaṁ', 'isam', 'kla', 'kli', 'kle', 'klō', 'krō', 'krē', 'ṭra', 'ṭri', 'ṭrō', 'ṯṯai'];
      const engHit = engClusters.find(c => w.includes(c));
      if (engHit) {
        reasons.push(`Rule 1.4: English cluster (${engHit})`);
        categories.add('English Loan');
      }

      // 1.5 Sanskrit y-clusters
      const sktY = ['ky', 'cy', 'ṭy', 'ṇy', 'ty', 'ny', 'py', 'my', 'ry', 'ly', 'vy', 'śy'];
      const yHit = sktY.find(c => w.includes(c));
      if (yHit) {
        reasons.push(`Rule 1.5: Sanskrit cluster (${yHit})`);
        categories.add('Sanskrit Loan');
      }

      // 1.6 Sanskrit v-clusters
      const sktV = ['kv', 'cv', 'ṭv', 'ṇv', 'tv', 'nv', 'pv', 'mv', 'rv', 'lv', 'śv'];
      const vHit = sktV.find(c => w.includes(c));
      if (vHit) {
        reasons.push(`Rule 1.6: Sanskrit cluster (${vHit})`);
        categories.add('Sanskrit Loan');
      }

      // 1.7 Sanskrit clusters with exceptions
      const sktCond = [
        ['kt', []], ['kn', []], ['kp', []], ['km', []],
        ['kr', ['mākri', 'pōkri']],
        ['kl', ['klāv']],
        ['kś', []], ['ṅm', []], ['ṅr', []], ['ṅl', []], ['ṅḷ', []],
        ['ct', []], ['cn', []], ['cm', []], ['cr', []], ['cl', []],
        ['ñk', []], ['ṭk', []], ['ṭṇ', []], ['ṭn', []], ['ṭp', []], ['ṭr', []], ['ṭc', []], ['ṅc', []], ['pt', []],
        ['pr', ['prāv']],
        ['pl', ['plāv', 'plāmpaḻa']],
        ['mt', []], ['mn', []], ['mr', []],
        ['ml', ['mlāv']],
        ['śk', []], ['śc', []], ['śṇ', []], ['śp', []], ['śn', []], ['śm', []], ['śl', []], ['śr', []]
      ];
      for (const [cl, exList] of sktCond) {
        if (w.includes(cl) && !(exList.length && hasException(exList))) {
          reasons.push(`Rule 1.7: Sanskrit cluster (${cl})`);
          categories.add('Sanskrit Loan');
          break;
        }
      }

      // 1.8 Sanskrit derived tense markers
      if (/karikku|kariccu|karikka|valkkari/.test(w)) {
        reasons.push('Rule 1.8: Sanskrit tense marker');
        categories.add('Sanskrit Loan');
      }

      // 1.9 Sanskrit derived nominal markers
      const sktNom = ['tvaṁ', 'tvam', 'karaṇaṁ', 'karaṇam', 'ryaṁ', 'ryam', 'ikaṁ', 'ikam', 'īyaṁ', 'īyam',
        'mayaṁ', 'mayam', 'paraṁ', 'param', 'pūrṇaṁ', 'pūrṇam', 'śīlaṁ', 'śīlam', 'ātmakaṁ', 'ātmakam',
        'itaṁ', 'itam', 'anīyaṁ', 'anīyam', 'tyaṁ', 'tyam', 'tamaṁ', 'tamam', 'vān', 'mān', 'vati', 'mati',
        'kāran', 'kāri', 'vādi', 'jñan', 'tāvŭ'];
      const nomHit = sktNom.find(m => w.endsWith(m) && w.length > m.length + 1);
      if (nomHit) {
        reasons.push(`Rule 1.9: Sanskrit nominal (-${nomHit})`);
        categories.add((nomHit === 'kāran' || nomHit === 'kāri') ? 'Sanskrit (Tadbhava)' : 'Sanskrit Loan');
      }

      // 1.10 Sanskrit derived adjectival markers
      const sktAdj = ['paraṁāya', 'paramāya', 'vattāya', 'mattāya', 'ātmaka', 'anīya', 'tavya', 'pūrṇa', 'śīla', 'maya', 'ika', 'īya', 'para', 'ita', 'tya', 'tama'];
      const adjHit = sktAdj.find(m => w.endsWith(m) && w.length > m.length + 1);
      if (adjHit) {
        reasons.push(`Rule 1.10: Sanskrit adjectival (-${adjHit})`);
        categories.add('Sanskrit Loan');
      }

      return { reasons, categories: Array.from(categories) };
    }

    // 4-Step Pipeline: (1) ISO -> (2) rootwords.csv -> (3) rulesofpacha.txt -> (4) sanskrit-non-detectable-words.csv
    function classifyLoanword(word) {
      const w = normalizeMalayalam(word);
      // Step 1: Convert input to ISO 15919
      const wIso = mlToIso(w);
      const stems = isolateIsoStems(wIso);
      const reasons = [];
      const categories = new Set();

      // Check user lexicon first
      const lexEntry = state.lexicon.find(e => e.src === w || e.srcIso === wIso || stems.includes(e.srcIso));
      if (lexEntry) {
        if (lexEntry.pos === 'പേര്' || lexEntry.origin === 'Name / Proper Noun') {
          return {
            word: w, iso: wIso, root: lexEntry.src, step: 2,
            isLoan: false, isName: true, categories: ['Name / Proper Noun'],
            reasons: ['Lexicon: Name (Untranslatable)']
          };
        }
        if (lexEntry.origin === 'Native / Dravidian') {
          return {
            word: w, iso: wIso, root: lexEntry.src, step: 2,
            isLoan: false, isName: false, categories: ['Native / Dravidian'],
            reasons: ['Lexicon: Native Pacha Malayalam']
          };
        }
      }

      // Step 2: Match rootwords.csv
      const rwName = lookupCsvDict(csvDicts.rootwords, ['COMPANY NAMES'], stems);
      if (rwName) {
        return {
          word: w, iso: wIso, root: rwName.match, step: 2,
          isLoan: false, isName: true, categories: ['Company / Proper Name'],
          reasons: [`Step 2 (rootwords.csv COMPANY NAMES: ${rwName.match})`]
        };
      }
      const rwEng = lookupCsvDict(csvDicts.rootwords, ['ENGLISH LOANS'], stems);
      if (rwEng) {
        reasons.push(`Step 2 (rootwords.csv ENGLISH LOANS: ${rwEng.match})`);
        categories.add('English Loan');
      }
      const rwNative = !rwEng ? lookupCsvDict(csvDicts.rootwords,
        ['AFFIRMATIVES', 'DEMONSTRATIVES', 'PRONOUNS', 'QUESTIONS', 'QUANTIFIERS', 'CONJUNCTIONS', 'INTERJUNCTIONS', 'ADVERBS', 'ADJECTIVES', 'VERBS', 'NOUNS'],
        stems
      ) : null;
      if (rwNative) {
        reasons.push(`Step 2 (rootwords.csv ${rwNative.col}: ${rwNative.match})`);
      }

      // Step 3: Apply rulesofpacha.txt (1.1 – 1.10)
      const ruleRes = checkPachaLoanRulesIso(wIso, stems);
      ruleRes.reasons.forEach(r => reasons.push(r));
      ruleRes.categories.forEach(c => categories.add(c));

      // Step 4: Cross-check sanskrit-non-detectable-words.csv (exact/stemmed + agglutinative verb-root prefix)
      const skEng = lookupCsvDict(csvDicts.sktNonDet, ['known english loans'], stems);
      const skSkt = !skEng
        ? (lookupCsvDict(csvDicts.sktNonDet, ['nouns', 'adjectives', 'verb roots', 'adverbs', 'post-positions'], stems)
           || lookupVerbRootPrefix(csvDicts.sktNonDet, 'verb roots', wIso))
        : null;
      if (skEng) {
        reasons.push(`Step 4 (Non-Detectable English: ${skEng.match})`);
        categories.add('English Loan');
      } else if (skSkt) {
        reasons.push(`Step 4 (Non-Detectable Sanskrit ${skSkt.col}: ${skSkt.match})`);
        categories.add('Sanskrit Loan');
      }

      let compoundParts = null;
      if (!rwEng && !skEng && !skSkt && typeof splitCompoundWordIso === 'function') {
        const comp = splitCompoundWordIso(wIso);
        if (comp) {
          compoundParts = [comp.leftIso, comp.rightIso];
          reasons.push(`Compound (${comp.leftIso} + ${comp.rightIso})`);
        }
      }
      const isLoan = Boolean(rwEng || ruleRes.reasons.length > 0 || skEng || skSkt);
      const step = (skEng || skSkt) ? 4 : (ruleRes.reasons.length > 0 ? 3 : 2);

      return {
        word: w,
        iso: wIso,
        root: (skEng || skSkt || rwEng || rwNative || { match: wIso }).match,
        step,
        isLoan,
        isName: false,
        compoundParts,
        categories: Array.from(categories),
        reasons
      };
    }

    const STORAGE_KEY_DB = 'pacha_malayalam_iso_sqlite_v2';


    // ==================== 4. MINIMAL TRANSLATOR STATE ====================
    let state = {
      lexicon: SEED_LEXICON.map(item => ({
        ...item,
        srcIso: mlToIso(item.src),
        tgtIso: item.tgt.map(mlToIso),
        isAbusive: Boolean(item.isAbusive),
        customCases: item.customCases || {}
      })),
      suffixRules: [...SEED_SUFFIX_RULES].sort((a, b) => b.src_suffix.length - a.src_suffix.length),
      overrides: SEED_OVERRIDES.map(o => ({
        ...o,
        src_iso: mlToIso(o.src_form),
        tgt_iso: o.tgt_forms.map(mlToIso)
      })),
      selectedAlts: {},
      customReplacements: {},
      lastTranslation: []
    };

    function mergeTrainedJsonArray(data) {
      if (!Array.isArray(data) || !data.length) return;
      const bySrc = new Map(state.lexicon.map(e => [e.src, e]));
      data.forEach((item, i) => {
        const src = normalizeMalayalam(item.src || item.malayalam || '');
        if (!src) return;
        const tgt = Array.isArray(item.tgt) ? item.tgt : [src];
        bySrc.set(src, {
          id: item.id || ('ext_' + i),
          src,
          srcIso: mlToIso(src),
          tgt: tgt.map(normalizeMalayalam),
          tgtIso: tgt.map(t => mlToIso(normalizeMalayalam(t))),
          pos: item.pos || 'നാമം',
          origin: item.origin || 'Sanskrit (Tatsama)',
          isGendered: Boolean(item.isGendered),
          rSandhi: item.rSandhi || 'ril',
          verbRoot: item.verbRoot || '',
          verbPast: item.verbPast || '',
          tgtVerbRoot: item.tgtVerbRoot || '',
          tgtVerbPast: item.tgtVerbPast || '',
          isAbusive: Boolean(item.isAbusive),
          customCases: item.customCases || {},
          notes: item.notes || ''
        });
      });
      state.lexicon = Array.from(bySrc.values());
    }

    function hydrateFromSqliteBytes(SQL, u8) {
      const db = new SQL.Database(u8);
      const cols = db.exec("PRAGMA table_info(lexicon)")[0]?.values.map(r => r[1]) || [];
      if (cols.length) {
        const has = c => cols.includes(c);
        const sel = [
          'id', 'src', 'src_iso', 'tgt_json', 'tgt_iso_json', 'pos', 'origin',
          'is_gendered', 'r_sandhi',
          has('is_root') ? 'is_root' : '0',
          has('verb_root') ? 'verb_root' : "''",
          has('verb_past') ? 'verb_past' : "''",
          has('tgt_verb_root') ? 'tgt_verb_root' : "''",
          has('tgt_verb_past') ? 'tgt_verb_past' : "''",
          has('is_abusive') ? 'is_abusive' : '0',
          has('custom_cases_json') ? 'custom_cases_json' : "'{}'",
          'notes', 'is_user'
        ].join(', ');
        const lexRes = db.exec(`SELECT ${sel} FROM lexicon ORDER BY is_user DESC, rowid ASC`);
        if (lexRes.length) {
          state.lexicon = lexRes[0].values.map(r => ({
            id: String(r[0]), src: String(r[1]), srcIso: String(r[2]),
            tgt: JSON.parse(r[3]), tgtIso: JSON.parse(r[4]),
            pos: String(r[5] || 'നാമം'), origin: String(r[6] || ''),
            isGendered: Number(r[7]) === 1, rSandhi: String(r[8] || 'ril'),
            isRoot: Number(r[9]) === 1,
            verbRoot: String(r[10] || ''), verbPast: String(r[11] || ''),
            tgtVerbRoot: String(r[12] || ''), tgtVerbPast: String(r[13] || ''),
            isAbusive: Number(r[14]) === 1,
            customCases: (() => { try { return JSON.parse(r[15] || '{}'); } catch(e) { return {}; } })(),
            notes: String(r[16] || ''), isUser: Number(r[17]) === 1
          }));
        }
      }
      try {
        const srRes = db.exec('SELECT id, src_suffix, case_type, notes FROM suffix_rules ORDER BY LENGTH(src_suffix) DESC, rowid ASC');
        if (srRes.length) {
          state.suffixRules = srRes[0].values.map(r => ({ id: String(r[0]), src_suffix: String(r[1]), case_type: String(r[2]), notes: String(r[3] || '') }));
        }
      } catch (e) {}
      try {
        const ovRes = db.exec('SELECT id, src_form, src_iso, tgt_json, tgt_iso_json, notes, is_user FROM inflection_overrides ORDER BY is_user DESC, rowid DESC');
        if (ovRes.length) {
          state.overrides = ovRes[0].values.map(r => ({ id: String(r[0]), src_form: String(r[1]), src_iso: String(r[2]), tgt_forms: JSON.parse(r[3]), tgt_iso: JSON.parse(r[4]), notes: String(r[5] || ''), isUser: Number(r[6]) === 1 }));
        }
      } catch (e) {}
      db.close();
    }

    // Auto-load trained data from: (1) shared Trainer localStorage SQLite, (2) hosted ./pacha_malayalam_iso.db, or (3) ./pacha_malayalam_iso.json / ./lexicon.json
    async function initOptionalLexicon() {
      try {
        let loadedSqlite = false;
        if (typeof window.initSqlJs === 'function') {
          const SQL = await window.initSqlJs({
            locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/${f}`
          });
          // 1. Hosted SQLite .db file on GitHub Pages
          if (location.protocol.startsWith('http')) {
            try {
              const dbRes = await fetch('pacha_malayalam_iso.db');
              if (dbRes.ok) {
                const buf = new Uint8Array(await dbRes.arrayBuffer());
                hydrateFromSqliteBytes(SQL, buf);
                loadedSqlite = true;
              }
            } catch (e) {}
          }
          // 2. Shared browser localStorage from Data Trainer on same origin
          if (!loadedSqlite) {
            try {
              const savedB64 = localStorage.getItem(STORAGE_KEY_DB);
              if (savedB64) {
                const bin = atob(savedB64);
                const u8 = new Uint8Array(bin.length);
                for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
                hydrateFromSqliteBytes(SQL, u8);
                loadedSqlite = true;
              }
            } catch (e) {}
          }
        }
        // 3. Fallback JSON file on GitHub Pages
        if (!loadedSqlite && location.protocol.startsWith('http')) {
          for (const jf of ['pacha_malayalam_iso.json', 'lexicon.json']) {
            try {
              const res = await fetch(jf);
              if (res.ok) {
                mergeTrainedJsonArray(await res.json());
                break;
              }
            } catch (e) {}
          }
        }
        renderOutput();
      } catch (e) {}
    }

    // ==================== 5. ISO-FIRST TOKEN LOOKUP & TRANSLATION ====================

    function isKnownAnyRootIso(isoCand) {
      if (!isoCand || isoCand.length < 2) return false;
      if (state.lexicon.some(e => e.srcIso === isoCand)) return true;
      if (csvDicts.loaded) {
        const rwCols = ['NOUNS', 'VERBS', 'ADJECTIVES', 'ADVERBS', 'ENGLISH LOANS', 'COMPANY NAMES', 'PRONOUNS'];
        for (const col of rwCols) {
          const s = csvDicts.rootwords[col];
          if (s && (s.has(isoCand) || (isoCand.endsWith('ŭ') && s.has(isoCand.slice(0, -1))))) return true;
        }
        const skCols = ['nouns', 'adjectives', 'verb roots', 'adverbs', 'known english loans'];
        for (const col of skCols) {
          const s = csvDicts.sktNonDet[col];
          if (s && (s.has(isoCand) || (isoCand.endsWith('ŭ') && s.has(isoCand.slice(0, -1))))) return true;
        }
      }
      return false;
    }

    function findLexiconOrStemMatch(isoWord) {
      const exact = state.lexicon.find(e => e.srcIso === isoWord);
      if (exact) return { entry: exact, chain: [] };
      const rules = [...state.suffixRules].sort((a, b) => b.src_suffix.length - a.src_suffix.length);
      for (const rule of rules) {
        const suf = rule.src_suffix;
        if (isoWord.length > suf.length + 1 && isoWord.endsWith(suf)) {
          const stem = isoWord.slice(0, isoWord.length - suf.length);
          const cands = [stem, stem + 'ŭ', stem + 'ṁ', stem + 'm'];
          if (stem.endsWith('ṟ')) cands.push(stem.slice(0, -1) + 'r');
          for (const c of cands) {
            const m = state.lexicon.find(e => e.srcIso === c);
            if (m) return { entry: m, chain: [rule.case_type] };
          }
        }
      }
      return null;
    }

    // Two-sided compound splitter: word = left + right where BOTH halves are valid roots
    function splitCompoundWordIso(wordIso) {
      if (!wordIso || wordIso.length < 6) return null;
      for (let split = wordIso.length - 3; split >= 3; split--) {
        const rawL = wordIso.slice(0, split);
        const rawR = wordIso.slice(split);

        const leftCands = [rawL];
        if (rawL.endsWith('a')) leftCands.push(rawL + 'ṁ', rawL + 'm');
        if (rawL.endsWith('ā')) leftCands.push(rawL.slice(0, -1) + 'aṁ');
        if (!/[aāiīuūeēoōŭṁ]$/.test(rawL)) leftCands.push(rawL + 'ŭ');

        let matchedLeft = leftCands.find(lc => state.lexicon.some(e => e.srcIso === lc)) || null;
        if (!matchedLeft) {
          for (const lc of leftCands) {
            if (isKnownAnyRootIso(lc)) { matchedLeft = lc; break; }
          }
        }
        if (!matchedLeft) continue;

        const rightCands = [rawR];
        // Handle compound gemination (kk, cc, tt, pp) e.g. vr̥kṣa + t + talappŭ
        if (/^(kk|cc|tt|pp)/.test(rawR) && rawR.length > 3) rightCands.push(rawR.slice(1));

        for (const rc of rightCands) {
          const rStems = isolateIsoStems(rc);
          const rightValid = rStems.some(rs => isKnownAnyRootIso(rs));
          if (rightValid) {
            return { leftIso: matchedLeft, rawLeft: rawL, rightIso: rc, rightStems: rStems };
          }
        }
      }
      return null;
    }

    function lookupIsoToken(wordIso) {
      // 0. Exact Inflection Override in ISO
      const ov = state.overrides.find(o => o.src_iso === wordIso);
      if (ov) {
        return {
          isOverride: true,
          entry: { id: ov.id, src: ov.src_form, srcIso: ov.src_iso, tgt: ov.tgt_forms, tgtIso: ov.tgt_iso, pos: 'Override', isGendered: false, rSandhi: 'ril' },
          caseChain: [],
          caseType: '',
          srcSuffix: '',
          underlyingMatch: lookupIsoTokenNoOverride(wordIso)
        };
      }
      return lookupIsoTokenNoOverride(wordIso);
    }
    function lookupIsoTokenNoOverride(wordIso) {
      // 1. Exact lexicon match in ISO (or verb past / verb root match)
      const exact = state.lexicon.find(e => e.srcIso === wordIso);
      if (exact) {
        return { isOverride: false, entry: exact, caseChain: [], caseType: '', srcSuffix: '' };
      }
      for (const e of state.lexicon) {
        if (e.customCases) {
          for (const [ct, form] of Object.entries(e.customCases)) {
            if (form && mlToIso(normalizeMalayalam(form)) === wordIso) {
              return { isOverride: false, entry: e, caseChain: [ct], caseType: ct, srcSuffix: '' };
            }
          }
        }
      }
      const pastMatch = state.lexicon.find(e => e.verbPast && e.verbPast.split(',').some(p => p.trim() && mlToIso(normalizeMalayalam(p.trim())) === wordIso));
      if (pastMatch) {
        return { isOverride: false, entry: pastMatch, caseChain: [], caseType: 'verb_past', srcSuffix: '' };
      }
      // 1b. Verb root + valid verb suffix match (prevents false compound matches like akrami + nāḷukaḷ)
      const PERS_NOUN_END = '(vanmār|vaḷumār|vaḷmār|van|vaḷ|var|tukaḷ|tŭ|va)';
      const VALID_VERB_PAST_REST = new RegExp(
        '^(ccukoṇṭirikkunna' + PERS_NOUN_END + '?|ccukoṇṭirunnu|ccukoṇṭirikkunnu|ccukoṇṭirikk|ccukoṇṭu|ccukoṇṭŭ|ccukoḷḷāṁ|ccatukoṇṭŭ|ccirikkunnu|ccirikkāṁ|ccirunnu|cciṭṭuṇṭŭ|cciṭṭillātta|cciṭṭilla|cciṭṭŭ|cciṭṭu|ccēkkāṁ|cceṅkil|ccillātta|ccilla|ccāluṁ|ccāl|ccuṁ|cca' + PERS_NOUN_END + '?|ccu|ppiccilla|ppiccŭ|ppiccu|ppicca|ppeṭuttiya|peṭuttiya|ppeṭṭa|peṭṭa|ṭṭilla|ṭilla|tilla|nilla|ṭṭillātta|ṭillātta|tillātta|nillātta|ṭṭu|ṭṭŭ|ṭṭa|ṭu|ṭŭ|ṭa|ttu|nnu|nna' + PERS_NOUN_END + '?|ññu|ñña|ññ|u?ttikkoṇṭŭ|ikkoṇṭŭ|ccikoṇṭŭ|u?ttiyatināl|iyatināl|ccatināl|u?ttiyilla|iyilla|cciyilla|u?ttiyiṭṭuṇṭŭ|iyiṭṭuṇṭŭ|u?ttiyiṭṭilla|iyiṭṭilla|u?ttittu|u?tti|u?ttu|u?tta|ikoṇṭŭ|iyatināl|iṭṭuṇṭŭ|iṭṭillātta|iṭṭilla|iṭṭŭ|iya|i$)'
      );
      const VALID_VERB_PRES_REST = new RegExp(
        '^(ppeṭuttēṇṭatallātta|peṭuttēṇṭatallātta|ppeṭuttēṇṭa|peṭuttēṇṭa|ppeṭuttātta|peṭuttātta|' +
        'y?kkānpōkunna' + PERS_NOUN_END + '?|ānpōkunna' + PERS_NOUN_END + '?|' +
        'y?kkunna' + PERS_NOUN_END + '?|unna' + PERS_NOUN_END + '?|' +
        'y?kkēṇṭa' + PERS_NOUN_END + '?|ēṇṭa' + PERS_NOUN_END + '?|' +
        'y?kkēṇṭatāyirunnu|ēṇṭatāyirunnu|y?kkēṇṭatilla|ēṇṭatilla|y?kkēṇṭa|ēṇṭa|' +
        'y?kkappeṭunnu|y?kkappeṭṭu|y?kkappeṭuṁ|y?kkappeṭṭa|appeṭunnu|appeṭṭu|appeṭuṁ|appeṭṭa|' +
        'y?ppikkuka|y?ppikkunnu|y?ppiccu|y?ppiccŭ|ppikkuka|ppikkunnu|ppikkunna|ppikkunnilla|ppikkumpōḷ|ppikkātta|ppikkukayilla|ppān|' +
        'y?kkātirikkuka|ātirikkuka|y?kkānākuṁ|ānākuṁ|y?kkāvunna|āvunna|y?kkāmeṇṇu|y?kkāmennŭ|āmennŭ|āmennu|' +
        'y?kkunnilla|unnilla|y?kkunnatalla|unnatalla|y?kkumpōḷ|umpōḷ|y?kkukayilla|ukayilla|ukilla|' +
        'y?kkāṟuṇṭŭ|āṟuṇṭŭ|y?kkāṟilla|āṟilla|y?kkātta|ātta|y?kkāte|āte|' +
        'y?kkaṇaṁ|aṇaṁ|y?kkaṇṭa|aṇṭa|y?kkarutŭ|arutŭ|y?kkaṭṭe|aṭṭe|' +
        'y?kkuka|y?uka|y?kkunnu|y?unnu|y?kkunna|y?unna|y?kkillē|y?illē|y?kkilla|y?illa|y?kkāṁ|y?āṁ|y?kkuṁ|y?uṁ|y?kkaṇaṁ|y?aṇaṁ|y?kkēṇṭa|y?ēṇṭa|y?kkātta|y?ātta|y?kkān|uvān|y?ān)'
      );
      for (const e of state.lexicon) {
        const rIso = e.verbRoot
          ? mlToIso(normalizeMalayalam(e.verbRoot.replace(/-+$/, ''))).replace(/[ŭu]$/, '')
          : (e.pos === 'ക്രിയ' && e.srcIso && e.srcIso.endsWith('uka') ? e.srcIso.replace(/(ykkuka|kkuka|uka)$/, '') : '');
        if (!rIso) continue;
        if (rIso && wordIso.startsWith(rIso) && wordIso.length > rIso.length) {
          const rest = wordIso.slice(rIso.length);
          if (VALID_VERB_PAST_REST.test(rest)) {
            return { isOverride: false, entry: e, caseChain: [], caseType: 'verb_root_past', srcSuffix: rest };
          }
          if (VALID_VERB_PRES_REST.test(rest)) {
            return { isOverride: false, entry: e, caseChain: [], caseType: 'verb_root_pres', srcSuffix: rest };
          }
        }
      }

      const rules = [...state.suffixRules].sort((a, b) => b.src_suffix.length - a.src_suffix.length);

      function generateStemCandidates(stem, suf) {
        // When suffix starts with -m linker (e.g. māya, māṇŭ, māyi), prefer -ṁ/-m noun stems before bare -a adjective stems
        const candidates = (suf && /^m[aāiīuūeēoō]/.test(suf) && stem.endsWith('a'))
          ? [stem + 'ṁ', stem + 'm', stem]
          : [stem];
        if (stem.endsWith('m')) candidates.push(stem.slice(0, -1) + 'ṁ'); // rājyam -> rājyaṁ
        if (stem.endsWith('ṁ')) candidates.push(stem.slice(0, -1) + 'm');
        if (stem.endsWith('a')) candidates.push(stem + 'm', stem + 'ṁ');
        if (stem.endsWith('ā') || stem.endsWith('ī') || stem.endsWith('ū') || stem.endsWith('e') || stem.endsWith('o')) {
          candidates.push(stem + 'vŭ');
        }
        candidates.push(stem + 'ŭ', stem + 'n', stem + 'am', stem + 'aṁ');
        if (stem.endsWith('ṇṇ')) candidates.push(stem.slice(0, -1));
        if (stem.endsWith('ṟ')) candidates.push(stem.slice(0, -1) + 'r');
        if (suf === 'ayye') candidates.push(stem + 'ai');
        if (suf === 'ine' && stem.endsWith('m')) candidates.push(stem.slice(0, -1) + 'ṁ');
        if (suf === 'nŭ') candidates.push(stem + 'n');
        if (suf.startsWith('ott')) candidates.push(stem + 'ŭ');
        if (suf.includes('tōṟu')) {
          if (stem.endsWith('n')) candidates.push(stem.slice(0, -1) + 'ṁ', stem.slice(0, -1) + 'm');
          if (stem.endsWith('vu')) candidates.push(stem.slice(0, -2));
          if (stem.endsWith('u')) candidates.push(stem.slice(0, -1), stem.slice(0, -1) + 'ŭ');
          if (stem.endsWith('t')) candidates.push(stem.slice(0, -1));
        }
        if (suf.startsWith('tt') && !stem.endsWith('a')) candidates.push(stem + 'am', stem + 'aṁ');
        if (stem.endsWith('yy')) candidates.push(stem.slice(0, -2) + 'ai', stem.slice(0, -2));
        if (stem.endsWith('y') || stem.endsWith('v')) {
          candidates.push(stem.slice(0, -1));
          if (stem.endsWith('aiy')) candidates.push(stem.slice(0, -1));
        }
        if (stem.endsWith('ll') || stem.endsWith('ḷḷ')) candidates.push(stem.slice(0, -1));
        if (suf === 'ṅṅaḷ') candidates.push(stem + 'm', stem + 'ṁ');
        if ((suf === 'uvēṇṭi' || suf === 'vēṇṭi') && stem.endsWith('kk')) candidates.push(stem + 'ŭ', stem + 'u');
        if (suf === 'āyi' && stem.endsWith('kk')) candidates.push(stem + 'ŭ');
        if ((suf === 'uṁ' || suf === 'umāyi' || suf === 'umottŭ') && stem.endsWith('v') && !stem.endsWith('āv')) candidates.push(stem.slice(0, -1) + 'm', stem.slice(0, -1) + 'ṁ');
        if (suf === 'kkuṁ' || suf === 'uṁ') {
          candidates.push(stem + 'u', stem + 'uka', stem + 'kkuka');
          if (stem.endsWith('kk')) candidates.push(stem.slice(0, -2), stem.slice(0, -2) + 'kkuka');
        }
        if (/^(kk)?(aṇaṁ|aṇṭa|arutŭ|attakka|ēṇṭa|aṭṭe|umō|illa|ēṇṭatilla|ēṇṭatillātta|ēṇṭatuṇṭō|ēṇṭatāṇō|ēṇṭatāya)$/.test(suf)) {
          candidates.push(stem + 'u', stem + 'uka', stem + 'kkuka');
          if (stem.endsWith('kk')) candidates.push(stem.slice(0, -2), stem.slice(0, -2) + 'kkuka');
        }
        if (/^(kk)?aṇ(aṁ|ṭa)$/.test(suf)) {
          candidates.push(stem + 'u', stem + 'uka', stem + 'kkuka');
          if (stem.endsWith('kk')) candidates.push(stem.slice(0, -2), stem.slice(0, -2) + 'kkuka');
        }
        return candidates;
      }

      // 2. Recursive multi-layer suffix stripping (up to 3 layers: e.g. pl + case + conj, or loc + adj_e)
      function searchRecursive(curIso, depth, accChain, accSuf) {
        if (curIso === 'paramāṇu') return null;
        for (const rule of rules) {
          const suf = rule.src_suffix;
          if (curIso.length > suf.length + 1 && curIso.endsWith(suf)) {
            const stem = curIso.slice(0, curIso.length - suf.length);
            // Special case: -ile (adj_e) peels to locative stem + 'il' so e.g. bhūmiyile -> bhūmiyil -> bhūmi
            if (rule.case_type === 'adj_e' && suf === 'ile') {
              const locStem = stem + 'il';
              const sub = searchRecursive(locStem, depth + 1, ['adj_e', ...accChain], suf);
              if (sub) return sub;
            }
            const nextChain = [rule.case_type, ...accChain];
            const nextSuf = suf + (accSuf ? '+' + accSuf : '');
            const candidates = generateStemCandidates(stem, suf);
            for (const cand of candidates) {
              const match = state.lexicon.find(e => e.srcIso === cand);
              if (match) {
                const pos = match.pos || 'നാമം';
                const hasNounCase = nextChain.some(ct => ['loc', 'gen', 'dat', 'acc', 'soc', 'pl', 'adj_e', 'abl', 'with', 'tog', 'for_āyi', 'for_vēṇṭi', 'towards', 'all', 'allative', 'voc_ō', 'ōḷaṁ', 'ōḷamō', 'ōḷamilla', 'ōḷamalla', 'atrē', 'itrē', 'āluṁ', 'ālē', 'skt_noun_only'].includes(ct));
                if ((hasNounCase || nextChain.some(ct => ct.startsWith('dat_') || ct.startsWith('dist_') || ct.startsWith('atrē') || ct.startsWith('itrē') || ct.startsWith('ālu'))) && !NOUN_PRONOUN_POS.has(pos)) continue;
                return { isOverride: false, entry: match, caseChain: nextChain, caseType: nextChain.join('+'), srcSuffix: nextSuf };
              }
            }
            if (depth < 2) {
              for (const cand of candidates) {
                const sub = searchRecursive(cand, depth + 1, nextChain, nextSuf);
                if (sub) return sub;
              }
            }
          }
        }
        return null;
      }

      const sufRes = searchRecursive(wordIso, 0, [], '');
      if (sufRes) return sufRes;

      function peelSlotGrammar(curIso, allowedSlots, accChain, accSufs, depth) {
        if (curIso === 'paramāṇu' || depth > 7) return null;
        for (const slotName of allowedSlots) {
          const morphemes = activeSlots[slotName] || [];
          for (const mor of morphemes) {
            if (curIso.length > mor.form.length + 1 && curIso.endsWith(mor.form)) {
              const rawStem = curIso.slice(0, curIso.length - mor.form.length);
              const nextChain = [mor.tag, ...accChain];
              const nextSufs = mor.form + (accSufs ? '+' + accSufs : '');
              const cands = getBoundaryCandidates(rawStem, mor.form, mor.tag);
              if (slotName !== 'VERB_END') for (const cand of cands) {
                const m = state.lexicon.find(e => e.srcIso === cand);
                if (m) {
                  const pos = m.pos || 'നാമം';
                  const hasNounSlot = nextChain.some(ct => ['loc', 'gen', 'dat', 'acc', 'soc', 'pl', 'adj_e', 'abl', 'with', 'tog', 'for_āyi', 'for_vēṇṭi', 'towards', 'allative', 'ōḷaṁ', 'voc_ō'].includes(ct) || ct.startsWith('dat_') || ct.startsWith('dist_'));
                  if (hasNounSlot && !NOUN_PRONOUN_POS.has(pos)) continue;
                  return { isOverride: false, entry: m, caseChain: nextChain, caseType: nextChain.join('+'), srcSuffix: nextSufs };
                }
              }
              const nextSlots = activeSlotPrev[slotName] || [];
              if (nextSlots.length > 0) {
                for (const cand of cands) {
                  const sub = peelSlotGrammar(cand, nextSlots, nextChain, nextSufs, depth + 1);
                  if (sub) return sub;
                }
              }
            }
          }
        }
        return null;
      }
      const slotRes = peelSlotGrammar(wordIso, ['CLITIC', 'COP_NEG', 'NOMINALIZER', 'PARTICIPLE', 'VERB_END', 'POSTP', 'CASE', 'PLURAL'], [], '', 0);
      if (slotRes) return slotRes;

      // 3. Compound word fallback (only when both halves are valid roots and at least one is in lexicon)
      const comp = splitCompoundWordIso(wordIso);
      if (comp) {
        const leftLex = state.lexicon.find(e => e.srcIso === comp.leftIso);
        const rightLex = findLexiconOrStemMatch(comp.rightIso);
        if (leftLex || rightLex) {
          return {
            isOverride: false,
            isCompound: true,
            compound: comp,
            leftLex,
            rightLex,
            entry: leftLex || rightLex.entry,
            caseChain: [],
            caseType: 'compound',
            srcSuffix: ''
          };
        }
      }
      return null;
    }

    function matchPhraseAt(rawTokens, startIdx) {
      const phraseEntries = state.lexicon
        .filter(e => e.src && /\s+/.test(e.src))
        .sort((a, b) => {
          const wa = a.src.trim().split(/\s+/).length;
          const wb = b.src.trim().split(/\s+/).length;
          return (wb - wa) || (b.src.length - a.src.length);
        });
      if (phraseEntries.length === 0) return null;

      for (const entry of phraseEntries) {
        const entryWords = entry.src.trim().split(/\s+/);
        const n = entryWords.length;
        if (n < 2) continue;

        // Collect n non-empty word tokens separated only by whitespace
        const wordIndices = [];
        let cur = startIdx;
        let valid = true;
        while (wordIndices.length < n && cur < rawTokens.length) {
          const t = rawTokens[cur];
          if (!t) { cur++; continue; }
          if (/^\s+$/.test(t)) { cur++; continue; }
          if (/^[.,!?;:"'()—–\-]+$/.test(t)) { valid = false; break; }
          wordIndices.push(cur);
          cur++;
        }
        if (!valid || wordIndices.length < n) continue;

        const spanWords = wordIndices.map(i => rawTokens[i]);
        const spanRaw = rawTokens.slice(startIdx, wordIndices[n - 1] + 1).join('');
        const spanIso = spanWords.map(w => mlToIso(w)).join(' ');

        // Exact phrase match
        if (spanIso === entry.srcIso) {
          return {
            endIdx: wordIndices[n - 1],
            raw: spanRaw,
            srcIso: spanIso,
            match: { isOverride: false, entry, caseChain: [], caseType: '', srcSuffix: '' }
          };
        }

        // Prefix words match exactly + final word matches with verb inflection or case/plural suffix
        const prefixMatch = entryWords.slice(0, n - 1).every((ew, wi) => mlToIso(ew) === mlToIso(spanWords[wi]));
        if (prefixMatch) {
          const lastEntryIso = mlToIso(entryWords[n - 1]);
          const lastSpanIso = mlToIso(spanWords[n - 1]);
          const tempEntry = { ...entry, src: entryWords[n - 1], srcIso: lastEntryIso };
          if (entry.pos === 'ക്രിയ' && lastEntryIso.endsWith('uka')) {
            const vBase = (lastEntryIso === 'ceyyuka') ? 'cey' : lastEntryIso.replace(/(ykkuka|kkuka|uka)$/, '');
            if (lastSpanIso.startsWith(vBase) && lastSpanIso.length > vBase.length) {
              let vRest = lastSpanIso.slice(vBase.length);
              if (lastEntryIso === 'ceyyuka' && vRest.startsWith('y')) vRest = vRest.slice(1);
              const isPast = /^(tu|tŭ|ta|tiṭṭ|tilla|tillātta|teṅkil|tāl|tāluṁ|tēkkāṁ|tirunnu|tirikk|tukoṇṭ|nnu|nnŭ|nna|ccu|ccŭ|cca|iṭṭ|i$)/.test(vRest);
              const normVRest = (lastEntryIso === 'ceyyuka' && /^t/.test(vRest)) ? ('cc' + vRest.slice(1)) : vRest;
              return {
                endIdx: wordIndices[n - 1],
                raw: spanRaw,
                srcIso: spanIso,
                match: { isOverride: false, entry, caseChain: [], caseType: isPast ? 'verb_root_past' : 'verb_root_pres', srcSuffix: normVRest }
              };
            }
          }
          const rules = [...state.suffixRules].sort((a, b) => b.src_suffix.length - a.src_suffix.length);
          const matchLastRec = (curIso, depth, accChain, accSuf) => {
            if (curIso === lastEntryIso) {
              return { isOverride: false, entry, caseChain: accChain, caseType: accChain.join('+'), srcSuffix: accSuf };
            }
            if (depth >= 3) return null;
            for (const rule of rules) {
              const suf = rule.src_suffix;
              if (curIso.length > suf.length + 1 && curIso.endsWith(suf)) {
                const stem = curIso.slice(0, curIso.length - suf.length);
                const nextChain = [rule.case_type, ...accChain];
                const nextSuf = suf + (accSuf ? '+' + accSuf : '');
                const cands = [stem, stem + 'ŭ', stem + 'ṁ', stem + 'm'];
                if (stem.endsWith('ṟ')) cands.push(stem.slice(0, -1) + 'r');
                if (suf === 'ṅṅaḷ') cands.push(stem + 'ṁ', stem + 'm');
                if (cands.includes(lastEntryIso)) {
                  return { isOverride: false, entry, caseChain: nextChain, caseType: nextChain.join('+'), srcSuffix: nextSuf };
                }
                if (depth < 2) {
                  for (const c of cands) {
                    const sub = matchLastRec(c, depth + 1, nextChain, nextSuf);
                    if (sub) return sub;
                  }
                }
              }
            }
            return null;
          };
          const peelPhraseSlot = (curIso, allowedSlots, accChain, accSuf, depth) => {
            if (depth > 7) return null;
            for (const slotName of allowedSlots) {
              const morphemes = activeSlots[slotName] || [];
              for (const mor of morphemes) {
                if (curIso.length > mor.form.length + 1 && curIso.endsWith(mor.form)) {
                  const rawStem = curIso.slice(0, curIso.length - mor.form.length);
                  const nextChain = [mor.tag, ...accChain];
                  const nextSuf = mor.form + (accSuf ? '+' + accSuf : '');
                  const cands = getBoundaryCandidates(rawStem, mor.form, mor.tag);
                  if (slotName !== 'VERB_END' && cands.includes(lastEntryIso)) {
                    return { isOverride: false, entry, caseChain: nextChain, caseType: nextChain.join('+'), srcSuffix: nextSuf };
                  }
                  const nextSlots = activeSlotPrev[slotName] || [];
                  if (nextSlots.length > 0) {
                    for (const c of cands) {
                      const sub = peelPhraseSlot(c, nextSlots, nextChain, nextSuf, depth + 1);
                      if (sub) return sub;
                    }
                  }
                }
              }
            }
            return null;
          };
          const phraseSubMatch = matchLastRec(lastSpanIso, 0, [], '') ||
            peelPhraseSlot(lastSpanIso, ['CLITIC', 'COP_NEG', 'NOMINALIZER', 'PARTICIPLE', 'VERB_END', 'POSTP', 'CASE', 'PLURAL'], [], '', 0);
          if (phraseSubMatch) {
            return {
              endIdx: wordIndices[n - 1],
              raw: spanRaw,
              srcIso: spanIso,
              match: phraseSubMatch
            };
          }
        }
      }
      return null;
    }

    function getAltCustomCases(entry, altIdx) {
      const cc = (entry && entry.customCases) ? entry.customCases : {};
      if (cc._byAlt && cc._byAlt[altIdx]) return cc._byAlt[altIdx];
      if (altIdx === 0) return cc;
      return {};
    }

    function inflectEntryAltIso(entry, altIdx, match, baseTgtIso) {
      if (match.isCompound && match.compound) {
        const lIso = match.leftLex ? (match.leftLex.tgtIso[altIdx] || match.leftLex.tgtIso[0]) : match.compound.rawLeft;
        const lJoin = (lIso.endsWith('aṁ') || lIso.endsWith('am')) ? lIso.slice(0, -1) : lIso.replace(/ŭ$/, '');
        let rIso = match.compound.rightIso;
        if (match.rightLex) {
          const rBase = match.rightLex.tgtIso[0];
          rIso = applyCaseSandhiChainIso(rBase, match.rightLex.chain, { pos: match.rightLex.entry.pos, isGendered: match.rightLex.entry.isGendered, rSandhi: match.rightLex.entry.rSandhi });
        }
        return lJoin + rIso;
      }
      if (match.isOverride) return baseTgtIso;
      const pastList = entry.tgtVerbPast ? entry.tgtVerbPast.split(',').map(s => s.trim()).filter(Boolean) : [];
      const rootList = entry.tgtVerbRoot ? entry.tgtVerbRoot.split(',').map(s => s.trim().replace(/-+$/, '')).filter(Boolean) : [];
      const altPastRaw = pastList[altIdx] || (altIdx === 0 ? pastList[0] : '');
      const altRootRaw = rootList[altIdx] || (altIdx === 0 ? rootList[0] : '');
      const tgtPastIso = altPastRaw ? mlToIso(normalizeMalayalam(altPastRaw)) : '';
      const derivedStem = baseTgtIso.replace(/(kkuka|ykkuka|uka|ŭ|u)$/, '');
      const tgtRootIso = altRootRaw ? mlToIso(normalizeMalayalam(altRootRaw)) : derivedStem;

      if (match.caseType === 'verb_past') {
        if (tgtPastIso) return tgtPastIso;
        if (baseTgtIso.endsWith('uka')) return baseTgtIso.slice(0, -3) + 'i';
        return baseTgtIso;
      }
      if (match.caseType === 'verb_root_past' || match.caseType === 'verb_root_pres') {
        const rest = match.srcSuffix || '';
        if (match.caseType === 'verb_root_past') {
          const effPast = tgtPastIso || (baseTgtIso.endsWith('uka') ? (baseTgtIso.slice(0, -3) + 'i') : baseTgtIso);
          const toPastAdj = p => {
            if (p.endsWith('ōyi') || p.endsWith('āyi')) return p.slice(0, -1) + 'a';
            if (p.endsWith('i')) return p + 'ya';
            if (p.endsWith('u') || p.endsWith('ŭ')) return p.slice(0, -1) + 'a';
            return p + 'a';
          };
          if (rest === 'ccŭ' || rest === 'tŭ') return effPast.endsWith('u') ? (effPast.slice(0, -1) + 'ŭ') : effPast;
          if (/^(ccu|ppiccu|i)$/.test(rest)) return effPast;
          if (rest === 'ppiccŭ') {
            let cStem = (derivedStem || tgtRootIso).replace(/ŭ$/, '').replace(/u$/, '').replace(/y?kk$/, '');
            return cStem + 'ppiccŭ';
          }
          if (rest.endsWith('koṇṭŭ') && /^(u?tti|cci|i)/.test(rest)) {
            if (effPast.endsWith('i')) return effPast + 'kkoṇṭŭ';
            if (effPast.endsWith('u') || effPast.endsWith('ŭ')) return effPast.slice(0, -1) + 'ukoṇṭŭ';
            return effPast + 'koṇṭŭ';
          }
          if (rest.endsWith('atināl')) {
            if (effPast.endsWith('i')) return effPast + 'yatināl';
            if (effPast.endsWith('u') || effPast.endsWith('ŭ')) return effPast.slice(0, -1) + 'atināl';
            return effPast + 'atināl';
          }
          if (rest.endsWith('iṭṭuṇṭŭ')) {
            if (effPast.endsWith('i')) return effPast + 'yiṭṭuṇṭŭ';
            if (effPast.endsWith('u') || effPast.endsWith('ŭ')) return effPast.slice(0, -1) + 'iṭṭuṇṭŭ';
            return effPast + 'iṭṭuṇṭŭ';
          }
          if (rest.endsWith('iṭṭilla')) {
            if (effPast.endsWith('i')) return effPast + 'yiṭṭilla';
            if (effPast.endsWith('u') || effPast.endsWith('ŭ')) return effPast.slice(0, -1) + 'iṭṭilla';
            return effPast + 'iṭṭilla';
          }
          if (rest.endsWith('illa') && !rest.endsWith('iṭṭilla')) {
            if (effPast.endsWith('i')) return effPast + 'yilla';
            if (effPast.endsWith('u') || effPast.endsWith('ŭ')) return effPast.slice(0, -1) + 'illa';
            return effPast + 'illa';
          }
          if (rest.startsWith('ccukoṇṭ') || rest.startsWith('ccukoḷḷ')) {
            const uTail = rest.slice(2); // ukoṇṭ..., ukoḷḷāṁ
            if (effPast.endsWith('i')) return effPast + 'k' + uTail.slice(1); // kayyēṟi + kkoṇṭ...
            if (effPast.endsWith('u') || effPast.endsWith('ŭ')) return effPast.slice(0, -1) + uTail; // vann + ukoṇṭ...
            return effPast + uTail;
          }
          if (rest.startsWith('cca') && rest !== 'ccatukoṇṭŭ') {
            return toPastAdj(effPast) + rest.slice(3); // ചെയ്തവൻ -> വന്നവൻ / കയ്യേറിയവൻ
          }
          if (rest === 'ccatukoṇṭŭ') {
            return toPastAdj(effPast) + 'tukoṇṭŭ';
          }
          if (rest === 'ppeṭṭa' || rest === 'peṭṭa') return toPastAdj(effPast);
          if (rest === 'ppicca' || rest === 'ppeṭuttiya' || rest === 'peṭuttiya') {
            let cStem = tgtRootIso.replace(/ŭ$/, '');
            if (derivedStem && derivedStem.length > cStem.length && derivedStem.slice(0, 3) === cStem.slice(0, 3)) cStem = derivedStem;
            cStem = cStem.replace(/u$/, '').replace(/y?kk$/, '');
            return cStem + 'ppicca';
          }
          const tail = rest.replace(/^(ppicc|cc|ṭṭ|ṭ|t|n)/, '');
          if (/^[aāiīuūeēoō]/.test(tail)) {
            if (effPast.endsWith('ŭ') || effPast.endsWith('u')) return effPast.slice(0, -1) + tail;
            if (effPast.endsWith('i')) return effPast + 'y' + tail;
          }
          return effPast + tail;
        } else {
          let stem = tgtRootIso.replace(/ŭ$/, '');
          if (derivedStem && derivedStem.length > stem.length && derivedStem.slice(0, 3) === stem.slice(0, 3)) {
            stem = derivedStem;
          } else if (tgtPastIso && tgtPastIso.startsWith(stem) && tgtPastIso.length === stem.length + 2) {
            const bridge = tgtPastIso.slice(stem.length, -1);
            if (bridge && /^[ṭḍḷṟtkc]$/.test(bridge)) stem = stem + bridge;
          }
          const needsKk = baseTgtIso.endsWith('kkuka') || /[lr]$/.test(baseTgtIso);
          // Causative -ppikk- / -yppikk-
          if (/^y?ppikk/.test(rest)) {
            const cStem = stem.replace(/u$/, '').replace(/y?kk$/, '');
            return cStem + rest.replace(/^y?/, '');
          }
          let normRest = rest.replace(/^(ppeṭutt|peṭutt|y?kk|pp|y(?=[auāē]))/, '');
          if (normRest === 'ukayilla') normRest = 'ukilla';
          if (normRest === 'ān' || normRest === 'uvān') {
            if (!needsKk && stem.endsWith('u')) return stem + 'vān';
            const cleanStem = (!needsKk && stem.endsWith('u')) ? stem.slice(0, -1) : stem;
            return cleanStem + (needsKk ? 'kk' : '') + 'ān';
          }
          if (normRest.startsWith('ānpōkunna')) {
            const tail = normRest.slice(2); // pōkunna...
            const inf = (!needsKk && stem.endsWith('u')) ? (stem + 'vān') : (stem.replace(/u$/, '') + (needsKk ? 'kk' : '') + 'ān');
            return inf + tail;
          }
          if (/^(uka|unnu|unna|unnilla|unnatalla|umpōḷ|ātta|ātirikkuka|ānākuṁ|āvunna|āmeṇṇu|āmennŭ|āmennu|ēṇṭa|ēṇṭatilla|ēṇṭatāyirunnu|ēṇṭatallātta|illē|illa|ukilla|uṁ|āṁ|aṇaṁ|aṇṭa|arutŭ|aṭṭe|āte|āṟuṇṭŭ|āṟilla|appeṭunnu|appeṭṭu|appeṭuṁ|appeṭṭa)/.test(normRest) || /^(unna|ēṇṭa)(van|vaḷ|var|tŭ|va|tukaḷ)/.test(normRest)) {
            const cleanStem = (!needsKk && stem.endsWith('u') && /^[uāaē]/.test(normRest)) ? stem.slice(0, -1) : stem;
            return cleanStem + (needsKk ? 'kk' : '') + normRest;
          }
          return stem + normRest;
        }
      }
      const chain = match.caseChain || (match.caseType ? [match.caseType] : []);
      const cc = getAltCustomCases(entry, altIdx);
      if (chain.length === 1 && cc[chain[0]]) {
        return mlToIso(normalizeMalayalam(cc[chain[0]]));
      } else if (chain.length > 1 && cc[chain[0]]) {
        const firstIso = mlToIso(normalizeMalayalam(cc[chain[0]]));
        return applyCaseSandhiChainIso(firstIso, chain.slice(1), { pos: entry.pos, isGendered: entry.isGendered, rSandhi: entry.rSandhi });
      }
      return applyCaseSandhiChainIso(baseTgtIso, chain, { pos: entry.pos, isGendered: entry.isGendered, rSandhi: entry.rSandhi });
    }

    // Phonetic Manglish -> Malayalam converter
    const MANG_INDEP = [
      ['au','ഔ'], ['ou','ഔ'], ['ai','ഐ'], ['aa','ആ'], ['ee','ഈ'], ['ii','ഈ'], ['oo','ഊ'], ['uu','ഊ'],
      ['A','ആ'], ['I','ഈ'], ['U','ഊ'], ['E','ഏ'], ['O','ഓ'], ['R','ഋ'],
      ['a','അ'], ['i','ഇ'], ['u','ഉ'], ['e','എ'], ['o','ഒ']
    ];
    const MANG_DEP = [
      ['au','ൗ'], ['ou','ൗ'], ['ai','ൈ'], ['aa','ാ'], ['ee','ീ'], ['ii','ീ'], ['oo','ൂ'], ['uu','ൂ'],
      ['A','ാ'], ['I','ീ'], ['U','ൂ'], ['E','േ'], ['O','ോ'], ['R','ൃ'],
      ['a',''], ['i','ി'], ['u','ു'], ['e','െ'], ['o','ൊ']
    ];
    const MANG_CONS = [
      ['chh','ഛ'], ['shh','ഷ'], ['thh','ഥ'], ['zh','ഴ'], ['ng','ങ'], ['nj','ഞ'], ['kh','ഖ'], ['gh','ഘ'],
      ['ch','ച'], ['jh','ഝ'], ['Th','ഠ'], ['Dh','ഢ'], ['th','ത'], ['dh','ദ'], ['ph','ഫ'], ['bh','ഭ'],
      ['sh','ശ'], ['rr','റ'], ['nt','ന്റ'],
      ['k','ക'], ['g','ഗ'], ['c','ച'], ['j','ജ'], ['T','ട'], ['D','ഡ'], ['N','ണ'],
      ['t','ത'], ['d','ദ'], ['n','ന'], ['p','പ'], ['f','ഫ'], ['b','ബ'], ['m','മ'],
      ['y','യ'], ['r','ര'], ['l','ല'], ['L','ള'], ['v','വ'], ['w','വ'], ['s','സ'], ['h','ഹ']
    ];
    const MANG_CHILLU = { 'n': 'ൻ', 'N': 'ൺ', 'r': 'ർ', 'l': 'ൽ', 'L': 'ൾ' };

    function manglishWordToMl(word) {
      if (!word || !/[a-zA-Z]/.test(word)) return word;
      let out = '';
      let i = 0;
      const matchTok = (arr, pos) => arr.find(([k]) => word.startsWith(k, pos)) || null;
      while (i < word.length) {
        if (word[i] === 'm' && (i + 1 >= word.length || !/[a-zA-Z]/.test(word[i + 1]))) {
          out += 'ം'; i++; continue;
        }
        const c = matchTok(MANG_CONS, i);
        if (c) {
          const [ck, cm] = c;
          i += ck.length;
          if (i >= word.length) {
            out += MANG_CHILLU[ck] || (cm + '്');
            continue;
          }
          const v = matchTok(MANG_DEP, i);
          if (v) {
            out += cm + v[1];
            i += v[0].length;
          } else {
            out += cm + '്';
          }
          continue;
        }
        const iv = matchTok(MANG_INDEP, i);
        if (iv) {
          out += iv[1];
          i += iv[0].length;
          continue;
        }
        out += word[i];
        i++;
      }
      return out;
    }

    function manglishTextToMl(txt) {
      return String(txt || '').split(/(\s+|[.,!?;:"'()—–\-*]+)/).map(tok => {
        if (!tok || !/[a-zA-Z]/.test(tok)) return tok;
        return manglishWordToMl(tok);
      }).join('');
    }

    function parseRulesXmlText(xmlText) {
      const doc = new DOMParser().parseFromString(String(xmlText || ''), 'text/xml');
      if (doc.querySelector('parsererror')) throw new Error('Invalid XML syntax');
      const slotNodes = doc.querySelectorAll('slots > slot');
      if (slotNodes.length > 0) {
        const parsedSlots = {};
        slotNodes.forEach(sEl => {
          const sName = (sEl.getAttribute('name') || '').trim();
          if (!sName) return;
          const items = [];
          sEl.querySelectorAll('m').forEach(mEl => {
            const form = (mEl.getAttribute('form') || '').trim();
            const tag = (mEl.getAttribute('tag') || '').trim();
            if (form && tag) items.push({ form, tag });
          });
          if (items.length) parsedSlots[sName] = items;
        });
        if (Object.keys(parsedSlots).length > 0) activeSlots = { ...DEFAULT_SLOTS, ...parsedSlots };
      }
      const prevNodes = doc.querySelectorAll('transitions > prev');
      if (prevNodes.length > 0) {
        const parsedPrev = {};
        prevNodes.forEach(pEl => {
          const from = (pEl.getAttribute('from') || '').trim();
          const to = (pEl.getAttribute('to') || '').split(',').map(x => x.trim()).filter(Boolean);
          if (from) parsedPrev[from] = to;
        });
        if (Object.keys(parsedPrev).length > 0) activeSlotPrev = { ...DEFAULT_SLOT_PREV, ...parsedPrev };
      }
      const rules = [];
      doc.querySelectorAll('suffixRules > rule').forEach((el, i) => {
        const src = (el.getAttribute('src') || '').trim();
        const ct = (el.getAttribute('caseType') || src).trim();
        const id = (el.getAttribute('id') || ('xml_' + i + '_' + src)).trim();
        const notes = (el.getAttribute('notes') || 'From pacha_rules.xml').trim();
        if (src && ct) rules.push({ id, src_suffix: src, case_type: ct, notes });
      });
      return rules;
    }

    async function initExternalRulesXml() {
      try {
        if (!location.protocol.startsWith('http')) return;
        const res = await fetch('pacha_rules.xml', { cache: 'no-store' });
        if (!res.ok) return;
        const rules = parseRulesXmlText(await res.text());
        if (rules.length) {
          const bySuf = new Map(state.suffixRules.map(r => [r.src_suffix, r]));
          rules.forEach(r => bySuf.set(r.src_suffix, r));
          state.suffixRules = Array.from(bySuf.values()).sort((a, b) => b.src_suffix.length - a.src_suffix.length);
        }
      } catch (e) {}
    }

    function translateText(mlInput) {
      const normalized = normalizeMalayalam(mlInput);
      // Split out *excluded* spans first so *word* is never translated or flagged
      const segments = normalized.split(/(\*[^*]+\*)/g);
      const allResults = [];
      let globalIdx = 0;
