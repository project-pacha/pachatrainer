      for (const seg of segments) {
        if (!seg) continue;
        if (seg.startsWith('*') && seg.endsWith('*') && seg.length > 2) {
          const inner = seg.slice(1, -1);
          allResults.push({
            type: 'native',
            raw: inner,
            srcIso: mlToIso(inner),
            outIso: mlToIso(inner),
            out: inner,
            excluded: true,
            idx: globalIdx++
          });
          continue;
        }
        const segTokens = translateSegmentTokens(seg, globalIdx);
        globalIdx += segTokens.length;
        allResults.push(...segTokens);
      }
      return allResults;
    }

    function translateSegmentTokens(segInput, baseIdx = 0) {
      const rawTokens = segInput.split(/(\s+|[.,!?;:"'()—–\-]+)/);
      const result = [];
      for (let idx = 0; idx < rawTokens.length; idx++) {
        let tok = rawTokens[idx];
        if (!tok) continue;
        if (/^\s+$/.test(tok) || /^[.,!?;:"'()—–\-]+$/.test(tok)) {
          result.push({ type: 'punct', raw: tok, srcIso: tok, outIso: tok, out: tok, idx });
          continue;
        }
        let srcIso = mlToIso(tok);
        let match = null;
        const phraseHit = matchPhraseAt(rawTokens, idx);
        if (phraseHit) {
          tok = phraseHit.raw;
          srcIso = phraseHit.srcIso;
          match = phraseHit.match;
          idx = phraseHit.endIdx;
        } else {
          match = lookupIsoToken(srcIso);
        }
        if (match) {
          const key = `${baseIdx + idx}_${tok}`;
          const isNameEntry = (match.entry.pos === 'പേര്' || match.entry.origin === 'Name / Proper Noun');
          if (isNameEntry && state.selectedAlts[key] === undefined) {
            result.push({
              type: 'name',
              raw: tok,
              srcIso,
              outIso: srcIso,
              out: tok,
              entry: match.entry,
              caseChain: match.caseChain,
              caseType: match.caseType,
              srcSuffix: match.srcSuffix,
              isOverride: match.isOverride,
            underlyingMatch: match.underlyingMatch || null,
              key,
              idx
            });
            continue;
          }
          const chosenIdx = state.selectedAlts[key] || 0;
          let baseTgtIso = match.entry.tgtIso[chosenIdx] || match.entry.tgtIso[0];
          let outIso = inflectEntryAltIso(match.entry, chosenIdx, match, baseTgtIso);
          const outMl = isoToMl(outIso);
          const isNativeNoHighlight = (match.entry.origin === 'Native / Dravidian') && !match.entry.isAbusive;
          const tokType = match.entry.isAbusive ? 'abusive' : (isNameEntry ? 'name' : (isNativeNoHighlight ? 'native' : 'replaced'));
          result.push({
            type: tokType,
            raw: tok,
            srcIso,
            outIso,
            out: outMl,
            entry: match.entry,
            caseChain: match.caseChain,
            caseType: match.caseType,
            srcSuffix: match.srcSuffix,
            isOverride: match.isOverride,
            chosenIdx,
            key,
            idx
          });
        } else {
          const loanInfo = classifyLoanword(tok);
          const uType = loanInfo.isLoan ? 'suspect' : (loanInfo.isName ? 'name' : 'native');
          result.push({
            type: uType,
            raw: tok,
            srcIso,
            outIso: srcIso,
            out: tok,
            loanInfo,
            key: `${baseIdx + idx}_${tok}`,
            idx
          });
        }
      }
      return result;
    }


    // ==================== 6. MINIMAL UI & HOVER/CLICK POPOVER ====================
    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.remove('hidden');
      clearTimeout(el._t);
      el._t = setTimeout(() => el.classList.add('hidden'), 2600);
    }

    function copyToClipboard(text, msg) {
      const fallback = () => {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast(msg);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => showToast(msg)).catch(fallback);
      } else fallback();
    }

    function getAlternativesForToken(t) {
      if (!t || !t.entry || !Array.isArray(t.entry.tgtIso)) return [];
      const isName = (t.type === 'name');
      const currentIdx = (isName && state.selectedAlts[t.key] === undefined) ? -1 : (state.selectedAlts[t.key] || 0);
      const list = [];
      const seen = new Set();
      if (isName) {
        list.push({ altIdx: -1, ml: t.raw, active: currentIdx === -1 && !state.customReplacements[t.key] });
        seen.add(t.raw);
      }
      t.entry.tgtIso.forEach((altIso, i) => {
        const infIso = inflectEntryAltIso(t.entry, i, t, altIso);
        const infMl = isoToMl(infIso);
        if (seen.has(infMl)) return;
        seen.add(infMl);
        list.push({ altIdx: i, ml: infMl, active: i === currentIdx && !state.customReplacements[t.key] });
      });
      if (t.isOverride && t.underlyingMatch && t.underlyingMatch.entry) {
        const ue = t.underlyingMatch.entry;
        ue.tgtIso.forEach((uIso, ui) => {
          const infIso = inflectEntryAltIso(ue, ui, t.underlyingMatch, uIso);
          const infMl = isoToMl(infIso);
          if (!seen.has(infMl)) {
            seen.add(infMl);
            list.push({ customVal: infMl, ml: infMl, active: state.customReplacements[t.key] === infMl });
          }
        });
      }
      return list.length > 1 ? list : [];
    }

    let focusedSplitTokKey = null;

    function updateFocusedTokenFromCursor() {
      const ta = document.getElementById('source-input');
      if (!ta || !state.lastTranslation.length) { focusedSplitTokKey = null; return; }
      const pos = ta.selectionStart || 0;
      const val = ta.value || '';
      // Find token index covering cursor position in raw input
      let offset = 0;
      let matched = null;
      for (const t of state.lastTranslation) {
        const len = t.excluded ? (t.raw.length + 2) : (t.raw ? t.raw.length : 0);
        if (pos >= offset && pos <= offset + len) {
          if (t.type !== 'punct' && t.type !== 'native') matched = t;
        }
        offset += len;
      }
      if (!matched) {
        // Fallback: check word immediately before cursor
        const before = val.slice(0, pos).trimEnd();
        const lastWord = before.split(/[\s.,!?;:"'()—–\-*]+/).pop();
        if (lastWord) {
          const lwNorm = normalizeMalayalam(document.getElementById('toggle-manglish')?.checked ? manglishWordToMl(lastWord) : lastWord);
          for (let i = state.lastTranslation.length - 1; i >= 0; i--) {
            const t = state.lastTranslation[i];
            if (t.raw === lwNorm && t.type !== 'punct' && t.type !== 'native') { matched = t; break; }
          }
        }
      }
      focusedSplitTokKey = matched ? matched.key : null;
      renderSplitPanelForFocused();
    }

    function renderSplitPanelForFocused() {
      const splitPanel = document.getElementById('alt-split-panel');
      const splitList = document.getElementById('alt-split-list');
      if (!splitPanel || !splitList) return;
      const t = focusedSplitTokKey ? state.lastTranslation.find(x => x.key === focusedSplitTokKey) : null;
      const alts = t ? getAlternativesForToken(t) : [];
      if (!t || alts.length <= 1) {
        splitPanel.classList.add('hidden');
        splitList.innerHTML = '';
        return;
      }
      splitPanel.classList.remove('hidden');
      splitList.innerHTML = `<div class="flex flex-wrap items-center gap-2 text-sm sm:text-xs">
        <span class="font-semibold text-slate-600 ml-text mr-1">${escapeHtml(t.raw)}:</span>
        ${alts.map(a => a.customVal
          ? `<button type="button" data-split-key="${escapeHtml(t.key)}" data-split-custom="${escapeHtml(a.customVal)}" class="px-2.5 py-1 rounded-md border ml-text ${a.active ? 'bg-emerald-600 text-white border-emerald-600 font-semibold' : 'bg-slate-50 hover:bg-emerald-50 text-slate-800 border-slate-200'}">${escapeHtml(a.ml)}</button>`
          : `<button type="button" data-split-key="${escapeHtml(t.key)}" data-split-alt="${a.altIdx}" class="px-2.5 py-1 rounded-md border ml-text ${a.active ? 'bg-emerald-600 text-white border-emerald-600 font-semibold' : 'bg-slate-50 hover:bg-emerald-50 text-slate-800 border-slate-200'}">${escapeHtml(a.ml)}</button>`
        ).join('')}
      </div>`;
    }

    function renderOutput() {
      let input = document.getElementById('source-input').value;
      const manglishOn = document.getElementById('toggle-manglish')?.checked;
      if (manglishOn && /[a-zA-Z]/.test(input)) {
        input = manglishTextToMl(input);
      }
      const tokens = translateText(input);
      state.lastTranslation = tokens;
      const displayEl = document.getElementById('output-display');
      const splitPanel = document.getElementById('alt-split-panel');
      const splitList = document.getElementById('alt-split-list');

      if (!input.trim()) {
        displayEl.innerHTML = '<span class="text-slate-400 select-none">പച്ചമലയാളം വിവർത്തനം ഇവിടെ കാണാം...</span>';
        if (splitPanel) splitPanel.classList.add('hidden');
        return;
      }

      displayEl.innerHTML = tokens.map((t, arrIdx) => {
        if (t.type === 'punct') return escapeHtml(t.out);
        if (t.type === 'native') return `<span class="lt-native">${escapeHtml(t.out)}</span>`;
        if (t.type === 'name' && getAlternativesForToken(t).length <= 1) {
          return `<span class="lt-native">${escapeHtml(t.out)}</span>`;
        }

        const shownOut = state.customReplacements[t.key] || t.out;
        let cls = 'lt-green';
        if (t.type === 'suspect' || t.type === 'abusive') cls = 'lt-red';
        else if (t.type === 'name') cls = 'lt-violet';

        return `<span class="lt-tok ${cls}" data-tok-idx="${arrIdx}">${escapeHtml(shownOut)}</span>`;
      }).join('');

      renderSplitPanelForFocused();
    }

    // Popover state (hover vs click-pinned analysis)
    let activeTokIdx = null;
    let isPinned = false;
    let showAnalysis = false;
    let showCorrectionForm = false;
    let hideTimer = null;

    function buildEndUserAnalysis(t) {
      const rows = [];
      if (t.type === 'replaced' && t.entry) {
        rows.push(['മൂലപദം', t.entry.src]);
        if (t.entry.pos) rows.push(['വിഭാഗം', t.entry.pos]);
        if (t.entry.origin) rows.push(['ഉറവിടം', t.entry.origin]);
        if (t.caseType) rows.push(['രൂപം', t.caseType]);
        if (t.entry.notes) rows.push(['കുറിപ്പ്', t.entry.notes]);
      } else if (t.type === 'abusive' && t.entry) {
        rows.push(['യഥാർത്ഥ പദം', t.raw]);
        rows.push(['നില', 'അനുചിതമായ പദം — പകരം മാറ്റി']);
        if (t.entry.notes) rows.push(['കുറിപ്പ്', t.entry.notes]);
      } else if (t.type === 'name') {
        rows.push(['പദം', t.raw]);
        rows.push(['വിഭാഗം', 'വ്യക്തിനാമം / സ്ഥാപനനാമം']);
      } else if (t.type === 'suspect' && t.loanInfo) {
        rows.push(['പദം', t.raw]);
        if (t.loanInfo.categories && t.loanInfo.categories.length) {
          rows.push(['തരം', t.loanInfo.categories.join(', ')]);
        }
        if (t.loanInfo.reasons && t.loanInfo.reasons.length) {
          rows.push(['കാരണം', t.loanInfo.reasons[0]]);
        }
      }
      if (!rows.length) return '';
      return `
        <div class="mt-2.5 pt-2.5 border-t border-slate-100 space-y-1 text-xs">
          <div class="text-[10px] font-bold uppercase tracking-wider text-slate-400">Word Analysis</div>
          ${rows.map(([k, v]) => `<div class="flex justify-between gap-2"><span class="text-slate-500">${escapeHtml(k)}</span><span class="font-medium text-slate-800 text-right ml-text">${escapeHtml(v)}</span></div>`).join('')}
        </div>`;
    }

    function renderPopoverContent(t) {
      const contentEl = document.getElementById('lt-popover-content');
      let badgeCls = 'bg-emerald-100 text-emerald-800';
      let badgeText = 'പച്ചമലയാളം';
      if (t.type === 'suspect') { badgeCls = 'bg-red-100 text-red-800'; badgeText = 'കടംവാങ്ങിയ വാക്ക് (Loanword)'; }
      else if (t.type === 'abusive') { badgeCls = 'bg-red-100 text-red-800'; badgeText = 'അനുചിതം — പകരം മാറ്റി'; }
      else if (t.type === 'name') { badgeCls = 'bg-violet-100 text-violet-800'; badgeText = 'പേര് (Proper Noun)'; }

      // Suggestions list
      let suggestionsHtml = '';
      if (t.entry && Array.isArray(t.entry.tgtIso) && t.entry.tgtIso.length > 0) {
        const isName = (t.type === 'name');
        const currentIdx = (isName && state.selectedAlts[t.key] === undefined) ? -1 : (state.selectedAlts[t.key] || 0);
        const btns = [];
        if (isName) {
          btns.push(`<button type="button" data-pop-alt="-1" class="px-2.5 py-1 rounded-lg text-xs ml-text border ${currentIdx === -1 ? 'bg-violet-600 text-white border-violet-600 font-semibold' : 'bg-slate-50 hover:bg-violet-50 text-slate-700 border-slate-200'}">${escapeHtml(t.raw)}</button>`);
        }
        const seen = new Set();
        t.entry.tgtIso.forEach((altIso, i) => {
          const infIso = inflectEntryAltIso(t.entry, i, t, altIso);
          const infMl = isoToMl(infIso);
          if (isName && infMl === t.raw) return;
          seen.add(infMl);
          const active = i === currentIdx && !state.customReplacements[t.key];
          btns.push(`<button type="button" data-pop-alt="${i}" class="px-2.5 py-1 rounded-lg text-xs ml-text border ${active ? 'bg-emerald-600 text-white border-emerald-600 font-semibold' : 'bg-slate-50 hover:bg-emerald-50 text-slate-800 border-slate-200'}">${escapeHtml(infMl)}</button>`);
        });
        if (t.isOverride && t.underlyingMatch && t.underlyingMatch.entry) {
          const ue = t.underlyingMatch.entry;
          ue.tgtIso.forEach((uIso, ui) => {
            const infIso = inflectEntryAltIso(ue, ui, t.underlyingMatch, uIso);
            const infMl = isoToMl(infIso);
            if (!seen.has(infMl)) {
              seen.add(infMl);
              const active = state.customReplacements[t.key] === infMl;
              btns.push(`<button type="button" data-pop-custom="${escapeHtml(infMl)}" class="px-2.5 py-1 rounded-lg text-xs ml-text border ${active ? 'bg-emerald-600 text-white border-emerald-600 font-semibold' : 'bg-slate-50 hover:bg-emerald-50 text-slate-800 border-slate-200'}">${escapeHtml(infMl)}</button>`);
            }
          });
        }
        if (btns.length) {
          suggestionsHtml = `
            <div class="mt-2">
              <div class="text-[10px] font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Suggestions</div>
              <div class="flex flex-wrap gap-1.5">${btns.join('')}</div>
            </div>`;
        }
      }

      const corrHtml = showCorrectionForm ? `
        <form id="lt-corr-form" class="mt-2.5 pt-2.5 border-t border-slate-100 space-y-2">
          <div class="text-[10px] font-bold uppercase tracking-wider text-slate-500">Send Correction</div>
          <input id="lt-corr-suggestion" type="text" required placeholder="പച്ചമലയാളം / തിരുത്തൽ..." class="w-full px-2.5 py-1.5 rounded-lg border border-slate-300 text-xs ml-text focus:outline-none focus:border-emerald-600" />
          <input id="lt-corr-note" type="text" placeholder="Optional note..." class="w-full px-2.5 py-1.5 rounded-lg border border-slate-300 text-xs focus:outline-none focus:border-emerald-600" />
          <div class="flex items-center justify-end gap-2">
            <button type="button" id="lt-corr-cancel" class="px-2.5 py-1 text-xs text-slate-500 hover:text-slate-800">Cancel</button>
            <button type="submit" class="px-3 py-1 rounded-lg bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold">Send</button>
          </div>
        </form>` : '';

      contentEl.innerHTML = `
        <div class="flex items-start justify-between gap-2">
          <div class="space-y-1">
            <span class="inline-block px-2 py-0.5 rounded-full text-[10px] font-semibold ${badgeCls}">${escapeHtml(badgeText)}</span>
            <div class="text-sm ml-text font-semibold text-slate-900">
              ${escapeHtml(t.raw)}
              ${t.out !== t.raw ? `<span class="text-slate-400 mx-1">→</span><span class="text-emerald-700">${escapeHtml(t.out)}</span>` : ''}
            </div>
          </div>
          <button type="button" id="lt-pop-close" class="text-slate-400 hover:text-slate-700 p-0.5">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>
        ${suggestionsHtml}
        ${showAnalysis ? buildEndUserAnalysis(t) : ''}
        ${corrHtml}
        <div class="mt-2.5 pt-2 border-t border-slate-100 flex items-center justify-between text-[11px]">
          ${!showAnalysis ? `<button type="button" id="lt-btn-analyze" class="text-slate-500 hover:text-slate-800 font-medium">Word analysis</button>` : '<span></span>'}
          ${!showCorrectionForm ? `<button type="button" id="lt-btn-corr" class="text-emerald-700 hover:text-emerald-800 font-semibold">Suggest correction</button>` : ''}
        </div>`;
    }

    function openPopoverForToken(el, arrIdx, pinned = false, withAnalysis = false) {
      clearTimeout(hideTimer);
      const t = state.lastTranslation[arrIdx];
      if (!t) return;
      focusedSplitTokKey = t.key;
      renderSplitPanelForFocused();
      activeTokIdx = arrIdx;
      isPinned = pinned;
      showAnalysis = withAnalysis;
      if (!pinned) showCorrectionForm = false;

      document.querySelectorAll('.lt-tok.lt-active').forEach(x => x.classList.remove('lt-active'));
      el.classList.add('lt-active');

      renderPopoverContent(t);
      const pop = document.getElementById('lt-popover');
      pop.classList.remove('hidden');

      const rect = el.getBoundingClientRect();
      const popW = pop.offsetWidth || 320;
      const popH = pop.offsetHeight || 160;
      let left = Math.min(Math.max(12, rect.left), window.innerWidth - popW - 12);
      let top = rect.bottom + 8;
      if (top + popH > window.innerHeight - 12) {
        top = Math.max(12, rect.top - popH - 8);
      }
      pop.style.left = left + 'px';
      pop.style.top = top + 'px';
    }

    function closePopover() {
      clearTimeout(hideTimer);
      activeTokIdx = null;
      isPinned = false;
      showAnalysis = false;
      showCorrectionForm = false;
      document.getElementById('lt-popover').classList.add('hidden');
      document.querySelectorAll('.lt-tok.lt-active').forEach(x => x.classList.remove('lt-active'));
    }

    function scheduleHidePopover() {
      if (isPinned) return;
      clearTimeout(hideTimer);
      hideTimer = setTimeout(() => {
        if (!isPinned) closePopover();
      }, 200);
    }

    // ==================== 7. EVENT WIRING ====================
    document.addEventListener('DOMContentLoaded', async () => {
      // Optional logo image check
      const logoImg = document.getElementById('app-logo');
      if (CONFIG.logoUrl) {
        logoImg.src = CONFIG.logoUrl;
        logoImg.onload = () => {
          logoImg.classList.remove('hidden');
          document.getElementById('logo-fallback').classList.add('hidden');
        };
      }

      await Promise.all([initCsvBundles(), initOptionalLexicon(), initExternalRulesXml()]);
      renderOutput();

      document.getElementById('toggle-manglish').addEventListener('change', () => {
        renderOutput();
      });

      document.getElementById('alt-split-list').addEventListener('click', e => {
        const btn = e.target.closest('[data-split-key]');
        if (!btn) return;
        const key = btn.dataset.splitKey;
        if (btn.dataset.splitCustom !== undefined) {
          state.customReplacements[key] = btn.dataset.splitCustom;
        } else {
          const val = Number(btn.dataset.splitAlt);
          delete state.customReplacements[key];
          if (val < 0) delete state.selectedAlts[key];
          else state.selectedAlts[key] = val;
        }
        renderOutput();
      });

      document.getElementById('source-input').addEventListener('input', e => {
        const ta = e.target;
        if (document.getElementById('toggle-manglish')?.checked && e.data && /^[\s.,!?;:]$/.test(e.data)) {
          const pos = ta.selectionStart;
          const before = ta.value.slice(0, pos);
          const m = before.match(/([a-zA-Z]+)([\s.,!?;:])$/);
          if (m) {
            const converted = manglishWordToMl(m[1]) + m[2];
            const newBefore = before.slice(0, before.length - m[0].length) + converted;
            ta.value = newBefore + ta.value.slice(pos);
            ta.selectionStart = ta.selectionEnd = newBefore.length;
          }
        }
        closePopover();
        renderOutput();
        updateFocusedTokenFromCursor();
      });
      ['click', 'keyup'].forEach(ev => {
        document.getElementById('source-input').addEventListener(ev, updateFocusedTokenFromCursor);
      });

      document.getElementById('btn-clear').addEventListener('click', () => {
        document.getElementById('source-input').value = '';
        state.selectedAlts = {};
        state.customReplacements = {};
        closePopover();
        renderOutput();
      });

      document.getElementById('btn-copy').addEventListener('click', () => {
        const plain = state.lastTranslation.map(t => state.customReplacements[t.key] || t.out).join('');
        if (!plain.trim()) return;
        copyToClipboard(plain, 'Copied!');
      });

      const outEl = document.getElementById('output-display');
      const popEl = document.getElementById('lt-popover');

      // Desktop hover -> dropdown suggestions
      outEl.addEventListener('mouseover', e => {
        const tokEl = e.target.closest('[data-tok-idx]');
        if (!tokEl || isPinned) return;
        openPopoverForToken(tokEl, Number(tokEl.dataset.tokIdx), false, false);
      });
      outEl.addEventListener('mouseout', e => {
        const tokEl = e.target.closest('[data-tok-idx]');
        if (!tokEl || isPinned) return;
        scheduleHidePopover();
      });

      // Click / Mobile Touch -> pin popover + show end-user Word Analysis
      outEl.addEventListener('click', e => {
        const tokEl = e.target.closest('[data-tok-idx]');
        if (!tokEl) return;
        e.stopPropagation();
        openPopoverForToken(tokEl, Number(tokEl.dataset.tokIdx), true, true);
      });

      popEl.addEventListener('mouseenter', () => clearTimeout(hideTimer));
      popEl.addEventListener('mouseleave', () => scheduleHidePopover());

      popEl.addEventListener('click', e => {
        e.stopPropagation();
        if (e.target.closest('#lt-pop-close')) { closePopover(); return; }
        if (e.target.closest('#lt-btn-analyze')) {
          isPinned = true; showAnalysis = true;
          renderPopoverContent(state.lastTranslation[activeTokIdx]);
          return;
        }
        if (e.target.closest('#lt-btn-corr')) {
          isPinned = true; showCorrectionForm = true;
          renderPopoverContent(state.lastTranslation[activeTokIdx]);
          const inp = document.getElementById('lt-corr-suggestion');
          if (inp) inp.focus();
          return;
        }
        if (e.target.closest('#lt-corr-cancel')) {
          showCorrectionForm = false;
          renderPopoverContent(state.lastTranslation[activeTokIdx]);
          return;
        }
        const custBtn = e.target.closest('[data-pop-custom]');
        if (custBtn && activeTokIdx !== null) {
          const t = state.lastTranslation[activeTokIdx];
          state.customReplacements[t.key] = custBtn.dataset.popCustom;
          closePopover();
          renderOutput();
          return;
        }
        const altBtn = e.target.closest('[data-pop-alt]');
        if (altBtn && activeTokIdx !== null) {
          const t = state.lastTranslation[activeTokIdx];
          const val = Number(altBtn.dataset.popAlt);
          delete state.customReplacements[t.key];
          if (val < 0) delete state.selectedAlts[t.key];
          else state.selectedAlts[t.key] = val;
          closePopover();
          renderOutput();
        }
      });

      popEl.addEventListener('submit', async e => {
        if (e.target.id !== 'lt-corr-form' || activeTokIdx === null) return;
        e.preventDefault();
        const t = state.lastTranslation[activeTokIdx];
        const sug = document.getElementById('lt-corr-suggestion').value.trim();
        const note = document.getElementById('lt-corr-note').value.trim();
        if (!sug) return;

        // Apply locally right away for the user
        state.customReplacements[t.key] = sug;
        renderOutput();

        const contextTxt = document.getElementById('source-input').value.trim().slice(0, 200);

        if (CONFIG.correctionEndpoint) {
          try {
            const res = await fetch(CONFIG.correctionEndpoint, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
              body: JSON.stringify({
                original: t.raw,
                suggested_pacha: sug,
                current_output: t.out,
                note,
                context: contextTxt
              })
            });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            showToast('നന്ദി! Correction sent!');
          } catch (err) {
            copyToClipboard(`Correction: ${t.raw} -> ${sug}${note ? ' (' + note + ')' : ''}`, 'Could not reach endpoint; copied correction to clipboard.');
          }
          closePopover();
          return;
        }

        const repoSlug = String(CONFIG.githubRepo || '').trim()
          .replace(/^https?:\/\/github\.com\//i, '')
          .replace(/\.git$/i, '')
          .replace(/^\/+|\/+$/g, '');

        if (repoSlug) {
          const title = encodeURIComponent(`Correction: ${t.raw} -> ${sug}`);
          const body = encodeURIComponent(
            `**Original:** ${t.raw}\n**Suggested Pacha Malayalam:** ${sug}\n**Current Output:** ${t.out}\n` +
            (note ? `**Note:** ${note}\n` : '') +
            `**Context:** \`${contextTxt}\``
          );
          const labels = CONFIG.githubLabels ? `&labels=${encodeURIComponent(CONFIG.githubLabels)}` : '';
          window.open(`https://github.com/${repoSlug}/issues/new?title=${title}&body=${body}${labels}`, '_blank', 'noopener');
          showToast('Opened GitHub correction form!');
        } else {
          copyToClipboard(`Correction: ${t.raw} -> ${sug}${note ? ' (' + note + ')' : ''}`, 'Correction applied & copied! Set CONFIG.correctionEndpoint for no-login submissions.');
        }
        closePopover();
      });

      document.addEventListener('click', e => {
        if (!e.target.closest('#lt-popover') && !e.target.closest('[data-tok-idx]')) {
          closePopover();
        }
      });
    });
  </script>
</body>
